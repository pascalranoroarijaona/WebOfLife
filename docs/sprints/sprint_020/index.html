<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web of Life - Sprint 20</title>
    <link rel="stylesheet" href="../../styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Web of Life - Sprint 20</h1>
            <nav>
                <a href="../sprint_019/index.html">← Sprint 19</a> | 
                <a href="../../index.html">Home</a> | 
                <a href="../sprint_021/index.html">Sprint 21 →</a>
            </nav>
        </header>
        <main>
            <section id="simulation-container">
                <h2>Ecosystem Simulation</h2>
                <div id="canvas-container"></div>
                <div id="controls">
                    <button id="start-btn">Start Simulation</button>
                    <button id="pause-btn">Pause</button>
                    <button id="reset-btn">Reset</button>
                </div>
            </section>
            <section id="metrics-container">
                <h3>Metrics</h3>
                <p>Population: <span id="pop-count">0</span></p>
            </section>
        </main>
    </div>
    <script type="module">
        import { initSimulation } from '../../../dist/main.js';
        
        window.addEventListener('DOMContentLoaded', () => {
            try {
                initSimulation();
            } catch (err) {
                console.error("Failed to initialize simulation:", err);
            }
        });
    </script>
</body>
</html>
