<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 20 - Web of Life</title>
    <link rel="stylesheet" href="../../../dist/styles.css">
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <div id="app">
        <header>
            <h1>Web of Life - Sprint 20</h1>
            <nav>
                <a href="../../index.html">Sprints Index</a>
            </nav>
        </header>
        <main>
            <div id="canvas-container"></div>
            <div id="ui-overlay">
                <h2>Sprint 20: Ecosystem Simulation & Diagnostics</h2>
                <p>Initializing Web of Life simulation environment...</p>
            </div>
        </main>
    </div>
    <script type="module">
        import * as THREE from 'three';
        console.log('Sprint 20 initialized with Three.js version:', THREE.REVISION);
        
        const container = document.getElementById('canvas-container');
        if (container) {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth * 0.8, window.innerHeight * 0.6);
            container.appendChild(renderer.domElement);

            const geometry = new THREE.BoxGeometry();
            const material = new THREE.MeshBasicMaterial({ color: 0x44aa88, wireframe: true });
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);

            camera.position.z = 5;

            function animate() {
                requestAnimationFrame(animate);
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
