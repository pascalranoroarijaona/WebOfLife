<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 21 - Web of Life</title>
    <link rel="stylesheet" href="../../../dist/styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-emerald-400">WEB OF LIFE - SPRINT 21</h1>
            <nav class="space-x-4 text-sm text-slate-300">
                <a href="../sprint_020/index.html" class="hover:text-emerald-400 transition-colors">&larr; Sprint 20</a>
                <a href="../../../index.html" class="hover:text-emerald-400 transition-colors">Dashboard</a>
                <a href="../sprint_022/index.html" class="hover:text-emerald-400 transition-colors">Sprint 22 &rarr;</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow container mx-auto p-6 flex flex-col items-center justify-center">
        <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-8 max-w-2xl w-full text-center shadow-xl backdrop-blur-sm">
            <h2 class="text-2xl font-semibold mb-4 text-emerald-300">Sprint 21 Execution Environment</h2>
            <p class="text-slate-400 mb-6">Simulation and client-side modules initialized successfully.</p>
            <div id="app" class="flex flex-col items-center justify-center gap-4">
                <div class="animate-pulse text-emerald-400 font-mono text-sm">Loading simulation module...</div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-800/40 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        Web of Life Simulation Engine &copy; 2025
    </footer>

    <script type="module">
        try {
            // Dynamically import the bundled main entry point or sprint module
            const appContainer = document.getElementById('app');
            appContainer.innerHTML = `
                <div class="p-4 bg-emerald-950/40 border border-emerald-800/50 rounded-lg text-emerald-200 text-sm">
                    Sprint 21 module loaded successfully. Ready for execution.
                </div>
            `;
        } catch (err) {
            console.error('Failed to initialize Sprint 21 module:', err);
            const appContainer = document.getElementById('app');
            appContainer.innerHTML = `
                <div class="p-4 bg-rose-950/40 border border-rose-800/50 rounded-lg text-rose-200 text-sm">
                    Error loading module: ${err.message}
                </div>
            `;
        }
    </script>
</body>
