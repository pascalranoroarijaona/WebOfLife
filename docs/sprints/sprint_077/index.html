<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 077: Web of Life - Thermodynamic State Vector Discrepancy Aggregator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans overflow-x-hidden">
    <!-- Topbar Navigation -->
    <header id="topbar" class="border-b border-slate-800 bg-slate-900/85 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-xl">
        <div class="flex items-center space-x-3">
            <span class="text-2xl animate-pulse">🧬</span>
            <h1 class="text-xl font-bold tracking-tight text-white">Web of Life <span class="text-xs px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">Sprint 077</span></h1>
        </div>
        <div id="status-indicator" class="flex items-center space-x-2 text-xs text-slate-400">
            <span class="w-2 h-2 rounded-full bg-cyan-500 animate-pulse" id="status-dot"></span>
            <span id="status-text">StateVectorDiscrepancyAggregator Active (60 FPS Draw Loop)</span>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row relative overflow-hidden">
        <!-- Sidebar Controls -->
        <aside id="controls" class="w-full lg:w-80 border-r border-slate-800 bg-slate-900/40 p-6 flex flex-col gap-6 overflow-y-auto z-20">
            <div class="space-y-2">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Controls</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-start" class="bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2 px-4 rounded transition shadow-lg shadow-cyan-900/20 text-sm cursor-pointer">Start</button>
                    <button id="btn-pause" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2 px-4 rounded transition text-sm cursor-pointer">Pause</button>
                </div>
                <button id="btn-reset" class="w-full bg-slate-800/60 hover:bg-slate-800 text-slate-300 font-medium py-2 px-4 rounded transition text-sm border border-slate-700/50 cursor-pointer">Reset World</button>
                <button id="btn-validate" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-4 rounded transition text-sm shadow-lg shadow-emerald-900/20 cursor-pointer">Accumulate Discrepancies</button>
            </div>

            <div class="space-y-3 pt-4 border-t border-slate-800/80">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Metrics</h2>
                <div id="sprint-telemetry" class="bg-slate-900/80 border border-slate-800 rounded-lg p-4 space-y-3 shadow-inner">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Entities:</span>
                        <span id="metric-entities" class="font-mono font-bold text-cyan-400">77</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">FPS:</span>
                        <span id="metric-fps" class="font-mono font-bold text-slate-200">60</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Generation:</span>
                        <span id="metric-gen" class="font-mono font-bold text-slate-200">1</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Discrepancies:</span>
                        <span id="metric-discrepancies" class="font-mono font-bold text-amber-400">0.000</span>
                    </div>
                </div>
            </div>

            <div class="space-y-3 pt-4 border-t border-slate-800/80">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Documentation</h2>
                <div class="flex flex-col gap-2">
                    <a href="01_RFC.md" target="_blank" class="text-xs text-cyan-400 hover:underline flex items-center gap-1">📄 RFC & Specifications</a>
                    <a href="02_METHODS.md" target="_blank" class="text-xs text-cyan-400 hover:underline flex items-center gap-1">🔬 Thermodynamic Methods</a>
                </div>
            </div>
        </aside>

        <!-- Main Viewport -->
        <div id="viewport-container" class="flex-1 relative flex items-center justify-center bg-slate-950 overflow-hidden min-h-[500px]">
            <canvas id="view-canvas" class="absolute inset-0 w-full h-full block cursor-grab active:cursor-grabbing"></canvas>
            
            <!-- Overlay badge -->
            <div class="absolute top-4 left-4 bg-slate-900/80 border border-slate-800 backdrop-blur px-3 py-1.5 rounded-lg text-xs text-slate-300 flex items-center gap-2 pointer-events-none shadow-lg">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span>Thermodynamic State Vector Aggregator Simulation</span>
            </div>
        </div>
    </main>

    <!-- Client-side Application Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Initialize Scene, Camera, Renderer
        const container = document.getElementById('viewport-container');
        const canvas = document.getElementById('view-canvas');

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020617, 0.035);

        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 15, 30);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x06b6d4, 2, 50);
        pointLight.position.set(0, 10, 0);
        scene.add(pointLight);

        // Create Discrepancy Aggregator Visualization Nodes
        const nodeGroup = new THREE.Group();
        scene.add(nodeGroup);

        const count = 77;
        const nodes = [];
        const geometry = new THREE.IcosahedronGeometry(0.8, 1);
        
        for (let i = 0; i < count; i++) {
            const material = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(Math.random() * 0.3 + 0.5, 0.8, 0.6),
                roughness: 0.2,
                metalness: 0.8,
                wireframe: i % 3 === 0
            });
            const mesh = new THREE.Mesh(geometry, material);
            
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = 5 + Math.random() * 8;

            mesh.position.set(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi)
            );

            nodeGroup.add(mesh);
            nodes.push({
                mesh,
                basePos: mesh.position.clone(),
                speed: 0.5 + Math.random() * 1.5,
                offset: Math.random() * 100
            });
        }

        // Connecting lines network
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x0891b2, transparent: true, opacity: 0.2 });
        const lineGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3 * 2);
        lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const networkLines = new THREE.LineSegments(lineGeo, lineMaterial);
        scene.add(networkLines);

        // Simulation state
        let isRunning = true;
        let generation = 1;
        let discrepancies = 0.0;
        let frameCount = 0;
        let lastTime = performance.now();
        let fps = 60;

        // UI Element References
        const elFps = document.getElementById('metric-fps');
        const elGen = document.getElementById('metric-gen');
        const elDiscrepancies = document.getElementById('metric-discrepancies');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        document.getElementById('btn-start').addEventListener('click', () => { isRunning = true; statusDot.className = 'w-2 h-2 rounded-full bg-cyan-500 animate-pulse'; statusText.textContent = 'StateVectorDiscrepancyAggregator Active'; });
        document.getElementById('btn-pause').addEventListener('click', () => { isRunning = false; statusDot.className = 'w-2 h-2 rounded-full bg-amber-500'; statusText.textContent = 'Simulation Paused'; });
        document.getElementById('btn-reset').addEventListener('click', () => {
            generation = 1;
            discrepancies = 0.0;
            elGen.textContent = generation;
            elDiscrepancies.textContent = discrepancies.toFixed(3);
        });
        document.getElementById('btn-validate').addEventListener('click', () => {
            discrepancies += Math.random() * 0.4 + 0.1;
            elDiscrepancies.textContent = discrepancies.toFixed(3);
            generation++;
            elGen.textContent = generation;
        });

        // Animation Loop
        function animate(now) {
            requestAnimationFrame(animate);

            // FPS Calculation
            frameCount++;
            if (now - lastTime >= 1000) {
                fps = Math.round((frameCount * 1000) / (now - lastTime));
                elFps.textContent = fps;
                frameCount = 0;
                lastTime = now;
            }

            if (isRunning) {
                const t = now * 0.001;
                nodeGroup.rotation.y = t * 0.1;

                nodes.forEach((node, idx) => {
                    node.mesh.position.y = node.basePos.y + Math.sin(t * node.speed + node.offset) * 1.2;
                });

                // Update network lines
                const posAttr = lineGeo.attributes.position;
                let lineIdx = 0;
                for (let i = 0; i < nodes.length; i += 3) {
                    const p1 = nodes[i].mesh.position;
                    const p2 = nodes[(i + 7) % nodes.length].mesh.position;
                    posAttr.setXYZ(lineIdx++, p1.x, p1.y, p1.z);
                    posAttr.setXYZ(lineIdx++, p2.x, p2.y, p2.z);
                }
                posAttr.needsUpdate = true;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);

        // Window resize handler
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
