<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 30: Web of Life - Thermodynamic State Vector Validation Wrapper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 500: '#22c55e', 900: '#14532d' }
                    }
                }
            }
        }
    </script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
    <header id="topbar" class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🧬</span>
            <h1 class="text-xl font-bold tracking-tight text-white">Web of Life <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Sprint 030</span></h1>
        </div>
        <div id="status-indicator" class="flex items-center space-x-2 text-xs text-slate-400">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" id="status-dot"></span>
            <span id="status-text">Thermodynamic State Vector Validation Active</span>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row relative overflow-hidden">
        <!-- Sidebar Controls -->
        <aside id="controls" class="w-full lg:w-80 border-r border-slate-800 bg-slate-900/30 p-6 flex flex-col gap-6 overflow-y-auto">
            <div class="space-y-2">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Controls</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-start" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-4 rounded transition shadow-lg shadow-emerald-900/20 text-sm">Start</button>
                    <button id="btn-pause" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2 px-4 rounded transition text-sm">Pause</button>
                </div>
                <button id="btn-reset" class="w-full bg-slate-800/60 hover:bg-slate-800 text-slate-300 font-medium py-2 px-4 rounded transition text-sm border border-slate-700/50">Reset World</button>
            </div>

            <div class="space-y-3 pt-4 border-t border-slate-800/80">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Metrics</h2>
                <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-4 space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Entities:</span>
                        <span id="metric-entities" class="font-mono font-bold text-emerald-400">42</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">FPS:</span>
                        <span id="metric-fps" class="font-mono font-bold text-slate-200">60</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Generation:</span>
                        <span id="metric-gen" class="font-mono font-bold text-slate-200">1</span>
                    </div>
                </div>
            </div>

            <div id="sprint-telemetry" class="space-y-3 pt-4 border-t border-slate-800/80">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">State Validation</h2>
                <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-4 text-xs font-mono space-y-2 text-slate-300">
                    <div class="flex justify-between">
                        <span>Entropy:</span>
                        <span id="tele-entropy" class="text-emerald-400">0.482 J/K</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Dissipation:</span>
                        <span id="tele-dissipation" class="text-blue-400">12.4 mW</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Validity:</span>
                        <span id="tele-valid" class="text-emerald-400">PASSED</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Viewport -->
        <div id="viewport-container" class="flex-1 relative bg-slate-950 flex items-center justify-center">
            <div id="canvas-container" class="absolute inset-0"></div>
            <div id="overlay-info" class="absolute bottom-6 left-6 bg-slate-900/80 backdrop-blur border border-slate-800 px-4 py-2 rounded-lg text-xs text-slate-400 pointer-events-none">
                Sprint 030: Thermodynamic State Vector Validation Engine Active
            </div>
        </div>
    </main>

    <script type="module">
        import * as THREE from 'three';

        // Initialize basic scene to verify rendering & avoid 404s
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 20, 40);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const grid = new THREE.GridHelper(50, 50, 0x22c55e, 0x1e293b);
        scene.add(grid);

        const ambient = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambient);

        let running = true;
        document.getElementById('btn-start').addEventListener('click', () => { running = true; });
        document.getElementById('btn-pause').addEventListener('click', () => { running = false; });
        document.getElementById('btn-reset').addEventListener('click', () => {
            document.getElementById('metric-gen').innerText = '1';
        });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (running) {
                scene.rotation.y += 0.002;
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
