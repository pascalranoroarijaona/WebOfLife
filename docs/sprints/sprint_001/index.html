<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 1: Web of Life - Ecosystem Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background-color: #0d1117;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
        }
        h1 { margin: 0 0 10px 0; font-size: 1.2rem; color: #58a6ff; }
        p { margin: 5px 0; font-size: 0.9rem; color: #8b949e; }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <h1>Web of Life - Sprint 1</h1>
        <p id="organism-count">Organisms: 0</p>
        <p id="fps">FPS: 0</p>
    </div>
    <div id="canvas-container">
        <canvas id="simulationCanvas" width="800" height="600"></canvas>
    </div>

    <script type="module">
        // Inline fallback / robust bootstrap for Sprint 1 simulation loop to prevent net::ERR_FAILED on relative module resolution
        const canvas = document.getElementById('simulationCanvas');
        const ctx = canvas.getContext('2d');
        const organismCountEl = document.getElementById('organism-count');
        const fpsEl = document.getElementById('fps');

        let organisms = [];
        let lastTime = performance.now();
        let frameCount = 0;
        let lastFpsUpdate = lastTime;
        let currentFps = 0;

        class SimpleOrganism {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = 6;
                this.color = '#3fb950';
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw(context) {
                context.beginPath();
                context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                context.fillStyle = this.color;
                context.fill();
                context.closePath();
            }
        }

        // Initialize population
        for (let i = 0; i < 25; i++) {
            organisms.push(new SimpleOrganism(
                Math.random() * canvas.width,
                Math.random() * canvas.height
            ));
        }

        function loop(timestamp) {
            frameCount++;
            if (timestamp - lastFpsUpdate >= 1000) {
                currentFps = Math.round((frameCount * 1000) / (timestamp - lastFpsUpdate));
                frameCount = 0;
                lastFpsUpdate = timestamp;
            }

            // Update
            organisms.forEach(org => org.update());

            // Render
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            organisms.forEach(org => org.draw(ctx));

            // UI
            organismCountEl.textContent = `Organisms: ${organisms.length}`;
            fpsEl.textContent = `FPS: ${currentFps}`;

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
