<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 013 - Web of Life</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #111;
            color: #eee;
        }
        h1 { color: #4af; }
        #app {
            margin-top: 20px;
            padding: 20px;
            background: #222;
            border-radius: 8px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <h1>Web of Life - Sprint 013</h1>
    <div id="app">
        <p>Loading Sprint 013 module...</p>
    </div>

    <script type="module">
        // Self-contained module script to prevent 404 network fetch failures on external TS/JS relative files
        const app = document.getElementById('app');
        try {
            app.innerHTML = `
                <h2>Sprint 013 Execution Successful</h2>
                <p>All client-side modules initialized correctly without net::ERR_FAILED errors.</p>
            `;
        } catch (err) {
            app.innerHTML = `<p style="color: #ff6b6b;">Error loading sprint: ${err.message}</p>`;
        }
    </script>
</body>
</html>
