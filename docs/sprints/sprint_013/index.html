<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 013 - Web of Life</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #161b22;
            padding: 1rem;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            margin: 0;
            font-size: 1.25rem;
        }
        #app {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        canvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background: #000;
        }
        .controls {
            padding: 0.5rem 1rem;
            background: #161b22;
            border-top: 1px solid #30363d;
            display: flex;
            gap: 1rem;
        }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #2ea043;
        }
    </style>
</head>
<body>
    <header>
        <h1>Web of Life - Sprint 013</h1>
        <div id="status">Initialized</div>
    </header>
    <div id="app">
        <canvas id="simulationCanvas" width="800" height="600"></canvas>
    </div>
    <div class="controls">
        <button id="restartBtn">Restart Simulation</button>
    </div>

    <script type="module">
        import { WebOfLifeApp } from '../../../src/main.ts';

        window.addEventListener('DOMContentLoaded', async () => {
            const canvas = document.getElementById('simulationCanvas');
            const status = document.getElementById('status');
            const restartBtn = document.getElementById('restartBtn');

            try {
                status.textContent = 'Running Sprint 013...';
                const app = new WebOfLifeApp(canvas);
                await app.initialize();
                app.start();

                restartBtn.addEventListener('click', () => {
                    app.restart();
                    status.textContent = 'Restarted';
                });
            } catch (err) {
                console.error('Failed to start Sprint 013 simulation:', err);
                status.textContent = 'Error: ' + err.message;
            }
        });
    </script>
</body>
</html>
