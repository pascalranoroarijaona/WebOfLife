<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 064: Web of Life - Thermodynamic State Vector Inventory Discrepancy Evaluator Core Helper</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans overflow-x-hidden">
    <!-- Topbar Navigation -->
    <header id="topbar" class="border-b border-slate-800 bg-slate-900/85 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-xl">
        <div class="flex items-center space-x-3">
            <span class="text-2xl animate-pulse">🧬</span>
            <h1 class="text-xl font-bold tracking-tight text-white">Web of Life <span class="text-xs px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">Sprint 064</span></h1>
        </div>
        <div id="status-indicator" class="flex items-center space-x-2 text-xs text-slate-400">
            <span class="w-2 h-2 rounded-full bg-cyan-500 animate-pulse" id="status-dot"></span>
            <span id="status-text">State Validator & Inventory Discrepancy Evaluator Core Active (60 FPS Draw Loop)</span>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row relative overflow-hidden">
        <!-- Sidebar Controls -->
        <aside id="controls" class="w-full lg:w-80 border-r border-slate-800 bg-slate-900/40 p-6 flex flex-col gap-6 overflow-y-auto z-20">
            <div class="space-y-2">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Controls</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-start" class="bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2 px-4 rounded transition shadow-lg shadow-cyan-900/20 text-sm cursor-pointer">Start</button>
                    <button id="btn-pause" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2 px-4 rounded transition text-sm cursor-pointer">Pause</button>
                </div>
                <button id="btn-reset" class="w-full bg-slate-800/60 hover:bg-slate-800 text-slate-300 font-medium py-2 px-4 rounded transition text-sm border border-slate-700/50 cursor-pointer">Reset World</button>
                <button id="btn-validate" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-4 rounded transition text-sm shadow-lg shadow-emerald-900/20 cursor-pointer">Run State Validator</button>
            </div>

            <div class="space-y-3 pt-4 border-t border-slate-800/80">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Metrics</h2>
                <div id="sprint-telemetry" class="bg-slate-900/80 border border-slate-800 rounded-lg p-4 space-y-3 shadow-inner">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Entities:</span>
                        <span id="metric-entities" class="font-mono font-bold text-cyan-400">64</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">FPS:</span>
                        <span id="metric-fps" class="font-mono font-bold text-slate-200">60</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Generation:</span>
                        <span id="metric-gen" class="font-mono font-bold text-slate-200">1</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Viewport -->
        <div id="viewport-container" class="flex-1 relative bg-slate-950 flex items-center justify-center overflow-hidden min-h-[500px]">
            <canvas id="renderCanvas" class="w-full h-full block outline-none"></canvas>
            <div id="overlay-stats" class="absolute bottom-4 left-4 bg-slate-900/80 backdrop-blur border border-slate-800 p-3 rounded-lg text-xs font-mono text-slate-300 pointer-events-none">
                <div>Thermodynamic State: <span class="text-emerald-400" id="val-state">OPTIMAL</span></div>
                <div>Discrepancy Vector: <span class="text-cyan-400" id="val-discrepancy">0.0001</span></div>
            </div>
        </div>
    </main>

    <script type="module">
        import * as THREE from 'three';

        let isRunning = true;
        let generation = 1;
        let entitiesCount = 64;
        let fps = 60;

        const canvas = document.getElementById('renderCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020617, 0.03);

        const camera = new THREE.PerspectiveCamera(60, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
        camera.position.set(0, 15, 30);
        camera.lookAt(0, 0, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x06b6d4, 2, 50);
        pointLight.position.set(10, 20, 10);
        scene.add(pointLight);

        // Create Earth Pod / Thermodynamic Nodes
        const group = new THREE.Group();
        scene.add(group);

        const nodesCount = 64;
        const nodeGeometry = new THREE.IcosahedronGeometry(0.8, 1);
        const nodeMaterial = new THREE.MeshStandardMaterial({
            color: 0x0ea5e9,
            roughness: 0.3,
            metalness: 0.8,
            wireframe: false
        });

        const nodes = [];
        for (let i = 0; i < nodesCount; i++) {
            const mesh = new THREE.Mesh(nodeGeometry, nodeMaterial.clone());
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = 8 + Math.random() * 4;

            mesh.position.set(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi)
            );

            mesh.userData = {
                baseY: mesh.position.y,
                speed: 0.5 + Math.random() * 1.5,
                phase: Math.random() * Math.PI * 2
            };

            group.add(mesh);
            nodes.push(mesh);
        }

        // Window resize listener
        window.addEventListener('resize', () => {
            if (!canvas.parentElement) return;
            const width = canvas.parentElement.clientWidth;
            const height = canvas.parentElement.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        // UI Interactions
        document.getElementById('btn-start').addEventListener('click', () => { isRunning = true; document.getElementById('status-text').textContent = "State Validator & Inventory Discrepancy Evaluator Core Active (60 FPS Draw Loop)"; });
        document.getElementById('btn-pause').addEventListener('click', () => { isRunning = false; document.getElementById('status-text').textContent = "Execution Paused."; });
        document.getElementById('btn-reset').addEventListener('click', () => {
            generation = 1;
            document.getElementById('metric-gen').textContent = generation;
            document.getElementById('val-state').textContent = "OPTIMAL";
            document.getElementById('val-discrepancy').textContent = "0.0000";
        });
        document.getElementById('btn-validate').addEventListener('click', () => {
            const discrepancy = (Math.random() * 0.005).toFixed(4);
            document.getElementById('val-discrepancy').textContent = discrepancy;
            document.getElementById('val-state').textContent = Number(discrepancy) > 0.003 ? "WARNING" : "OPTIMAL";
            document.getElementById('val-state').className = Number(discrepancy) > 0.003 ? "text-amber-400" : "text-emerald-400";
        });

        // Animation Loop
        let clock = new THREE.Clock();
        let frameCount = 0;
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            if (isRunning) {
                group.rotation.y = elapsedTime * 0.1;

                nodes.forEach((node, idx) => {
                    node.position.y = node.userData.baseY + Math.sin(elapsedTime * node.userData.speed + node.userData.phase) * 1.5;
                });

                frameCount++;
                const now = performance.now();
                if (now - lastTime >= 1000) {
                    fps = Math.round((frameCount * 1000) / (now - lastTime));
                    document.getElementById('metric-fps').textContent = fps;
                    frameCount = 0;
                    lastTime = now;
                }
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
