<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 14 - Web of Life</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05050a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        p {
            margin: 0;
            font-size: 0.9rem;
            color: #8888aa;
        }
    </style>
    <!-- Import map for robust browser ES module resolution -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.160.0",
        "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <div id="ui-overlay">
        <h1>Sprint 14</h1>
        <p>Web of Life Simulation Engine Active</p>
    </div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';

        // Initialize basic Three.js scene to verify imports and rendering
        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05050a, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 50);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Add ambient and directional lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00ffcc, 1);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // Add a central node mesh representing the Web of Life
        const geometry = new THREE.IcosahedronGeometry(10, 2);
        const material = new THREE.MeshStandardMaterial({
            color: 0x00ffcc,
            wireframe: true,
            emissive: 0x004433,
            roughness: 0.3,
            metalness: 0.8
        });
        const coreMesh = new THREE.Mesh(geometry, material);
        scene.add(coreMesh);

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            coreMesh.rotation.x += 0.002;
            coreMesh.rotation.y += 0.003;

            renderer.render(scene, camera);
        }

        animate();

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
