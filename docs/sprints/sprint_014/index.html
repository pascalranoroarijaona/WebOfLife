<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 014: Web of Life Simulation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #111;
            color: #eee;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 10px; color: #4CAF50; }
        #canvas-container {
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        canvas { display: block; }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #388e3c; }
        #stats {
            margin-top: 15px;
            font-family: monospace;
            font-size: 14px;
            background: #1e1e1e;
            padding: 10px 20px;
            border-radius: 4px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <h1>Web of Life - Sprint 014</h1>
    <div id="canvas-container">
        <canvas id="simCanvas" width="800" height="600"></canvas>
    </div>
    <div class="controls">
        <button id="pauseBtn">Pause / Resume</button>
        <button id="resetBtn">Reset Simulation</button>
    </div>
    <div id="stats">Initializing simulation...</div>

    <script type="module">
        import { Simulation } from '../../src/simulation.js';

        const canvas = document.getElementById('simCanvas');
        const statsEl = document.getElementById('stats');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        let simulation = new Simulation(canvas);
        simulation.start();

        let isPaused = false;
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            if (isPaused) {
                simulation.stop();
                pauseBtn.textContent = 'Resume';
            } else {
                simulation.start();
                pauseBtn.textContent = 'Pause';
            }
        });

        resetBtn.addEventListener('click', () => {
            simulation.stop();
            simulation = new Simulation(canvas);
            simulation.start();
            isPaused = false;
            pauseBtn.textContent = 'Pause';
        });

        // Update stats periodically
        setInterval(() => {
            const stats = simulation.getStats();
            statsEl.textContent = `FPS: ${stats.fps || 60} | Entities: ${stats.entityCount || 0} | Generation: ${stats.generation || 1}`;
        }, 500);
    </script>
</body>
</html>
