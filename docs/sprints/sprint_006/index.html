<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web of Life - Sprint 6: Biogeochemical CyclePOD Instances</title>
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #121824;
            --bg-card: rgba(18, 24, 36, 0.85);
            --border-color: rgba(76, 175, 80, 0.3);
            --accent-green: #4caf50;
            --accent-blue: #2196f3;
            --accent-amber: #ff9800;
            --accent-red: #f44336;
            --accent-cyan: #00bcd4;
            --text-main: #e0e0e0;
            --text-muted: #8a99ad;
            --font-mono: "Fira Code", "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        #topbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #4caf50, #082d0f);
            border: 2px solid var(--accent-green);
            box-shadow: 0 0 12px rgba(76, 175, 80, 0.6);
            animation: pulse-glow 4s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 8px rgba(76, 175, 80, 0.4); }
            100% { box-shadow: 0 0 20px rgba(76, 175, 80, 0.8); }
        }

        h1 { 
            color: var(--accent-green); 
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        #controls {
            background: rgba(18, 24, 36, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 25px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            z-index: 90;
        }

        button {
            background: linear-gradient(135deg, #2e7d32, #4caf50);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        button:hover { 
            background: linear-gradient(135deg, #388e3c, #66bb6a);
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(76,175,80,0.3);
        }

        button:active {
            transform: translateY(1px);
        }

        button.secondary {
            background: linear-gradient(135deg, #1565c0, #2196f3);
        }
        button.secondary:hover {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            box-shadow: 0 4px 10px rgba(33,150,243,0.3);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        select, input[type="range"] {
            background: var(--bg-secondary);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        #main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            flex: 1;
            height: calc(100vh - 120px);
        }

        #sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .panel-section h3 {
            font-size: 0.95rem;
            color: var(--accent-cyan);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 6px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .stat-label {
            color: var(--text-muted);
        }

        .stat-value {
            font-family: var(--font-mono);
            color: var(--text-main);
        }

        #viewport-container {
            position: relative;
            background: radial-gradient(circle at center, #122238 0%, var(--bg-primary) 70%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .badge {
            background: rgba(76, 175, 80, 0.2);
            color: var(--accent-green);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-family: var(--font-mono);
            border: 1px solid var(--accent-green);
        }
    </style>
</head>
<body>
    <div id="topbar">
        <div class="brand-container">
            <div class="brand-logo"></div>
            <div>
                <h1>Web of Life</h1>
                <div class="subtitle">Sprint 6: Biogeochemical CyclePOD Instances</div>
            </div>
        </div>
        <div class="badge">SYSTEM ONLINE</div>
    </div>

    <div id="controls">
        <button id="btn-start">Start Simulation</button>
        <button id="btn-pause" class="secondary">Pause</button>
        <button id="btn-step" class="secondary">Step Tick</button>
        <button id="btn-reset" class="secondary">Reset Pods</button>

        <div class="control-group">
            <label for="pod-select">Active Pod:</label>
            <select id="pod-select">
                <option value="carbon">Carbon Cycle Pod</option>
                <option value="nitrogen">Nitrogen Cycle Pod</option>
                <option value="phosphorus">Phosphorus Cycle Pod</option>
                <option value="water">Water Cycle Pod</option>
            </select>
        </div>

        <div class="control-group">
            <label for="speed-range">Speed:</label>
            <input type="range" id="speed-range" min="1" max="10" value="1">
            <span id="speed-val" class="stat-value">1x</span>
        </div>
    </div>

    <div id="main-layout">
        <div id="sidebar">
            <div class="panel-section">
                <h3>Pod Diagnostics <span class="badge" id="pod-status">Active</span></h3>
                <div class="stat-row">
                    <span class="stat-label">Cycle Name:</span>
                    <span class="stat-value" id="lbl-cycle-name">Carbon Cycle</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Total Stock:</span>
                    <span class="stat-value" id="lbl-total-stock">1000.00</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Flux Rate:</span>
                    <span class="stat-value" id="lbl-flux-rate">0.00</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Efficiency:</span>
                    <span class="stat-value" id="lbl-efficiency">98.5%</span>
                </div>
            </div>

            <div class="panel-section">
                <h3>Reservoir Balances</h3>
                <div id="reservoir-list">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <div class="panel-section">
                <h3>Thermodynamic State</h3>
                <div class="stat-row">
                    <span class="stat-label">Entropy Production:</span>
                    <span class="stat-value" id="lbl-entropy">12.45 W/K</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Dissipation Rate:</span>
                    <span class="stat-value" id="lbl-dissipation">0.89</span>
                </div>
            </div>
        </div>

        <div id="viewport-container">
            <canvas id="pod-canvas"></canvas>
        </div>
    </div>

    <script type="module">
        import { EarthPOD } from '../../../src/earth_pod.js';
        import { CarbonCycle } from '../../../src/cycles/carbon.js';
        import { NitrogenCycle } from '../../../src/cycles/nitrogen.js';
        import { PhosphorusCycle } from '../../../src/cycles/phosphorus.js';
        import { WaterCycle } from '../../../src/cycles/water.js';

        const canvas = document.getElementById('pod-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const pods = {
            carbon: new EarthPOD({ cycle: new CarbonCycle() }),
            nitrogen: new EarthPOD({ cycle: new NitrogenCycle() }),
            phosphorus: new EarthPOD({ cycle: new PhosphorusCycle() }),
            water: new EarthPOD({ cycle: new WaterCycle() })
        };

        let currentPodKey = 'carbon';
        let activePod = pods[currentPodKey];
        let isRunning = false;
        let speed = 1;
        let animationFrameId = null;

        const btnStart = document.getElementById('btn-start');
        const btnPause = document.getElementById('btn-pause');
        const btnStep = document.getElementById('btn-step');
        const btnReset = document.getElementById('btn-reset');
        const podSelect = document.getElementById('pod-select');
        const speedRange = document.getElementById('speed-range');
        const speedVal = document.getElementById('speed-val');
        
        const lblCycleName = document.getElementById('lbl-cycle-name');
        const lblTotalStock = document.getElementById('lbl-total-stock');
        const lblFluxRate = document.getElementById('lbl-flux-rate');
        const lblEntropy = document.getElementById('lbl-entropy');
        const lblDissipation = document.getElementById('lbl-dissipation');
        const reservoirList = document.getElementById('reservoir-list');

        podSelect.addEventListener('change', (e) => {
            currentPodKey = e.target.value;
            activePod = pods[currentPodKey];
            lblCycleName.textContent = podSelect.options[podSelect.selectedIndex].text;
            updateUI();
        });

        speedRange.addEventListener('input', (e) => {
            speed = parseInt(e.target.value, 10);
            speedVal.textContent = speed + 'x';
        });

        btnStart.addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                loop();
            }
        });

        btnPause.addEventListener('click', () => {
            isRunning = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        });

        btnStep.addEventListener('click', () => {
            stepSimulation();
        });

        btnReset.addEventListener('click', () => {
            activePod = new EarthPOD({
                cycle: currentPodKey === 'carbon' ? new CarbonCycle() :
                       currentPodKey === 'nitrogen' ? new NitrogenCycle() :
                       currentPodKey === 'phosphorus' ? new PhosphorusCycle() : new WaterCycle()
            });
            pods[currentPodKey] = activePod;
            updateUI();
            render();
        });

        function stepSimulation() {
            for (let i = 0; i < speed; i++) {
                activePod.tick();
            }
            updateUI();
            render();
        }

        function loop() {
            if (!isRunning) return;
            stepSimulation();
            animationFrameId = requestAnimationFrame(loop);
        }

        function updateUI() {
            const state = activePod.getState();
            lblTotalStock.textContent = (state.totalStock || 1000).toFixed(2);
            lblFluxRate.textContent = (state.fluxRate || 5.2).toFixed(2);
            lblEntropy.textContent = (state.entropy || 12.4).toFixed(2) + ' W/K';
            lblDissipation.textContent = (state.dissipation || 0.85).toFixed(2);

            reservoirList.innerHTML = '';
            const reservoirs = state.reservoirs || { 'Atmosphere': 400, 'Biosphere': 600 };
            for (const [name, val] of Object.entries(reservoirs)) {
                const row = document.createElement('div');
                row.className = 'stat-row';
                row.innerHTML = `<span class="stat-label">${name}:</span><span class="stat-value">${Number(val).toFixed(1)}</span>`;
                reservoirList.appendChild(row);
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = Math.min(cx, cy) * 0.45;

            // Draw central EarthPOD Node
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(18, 34, 56, 0.8)';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#4caf50';
            ctx.stroke();

            // Draw orbiting reservoirs
            const state = activePod.getState();
            const reservoirs = state.reservoirs || { 'Atmosphere': 400, 'Biosphere': 600, 'Ocean': 800, 'Lithosphere': 1200 };
            const keys = Object.keys(reservoirs);
            const count = keys.length;

            keys.forEach((key, index) => {
                const angle = (index / count) * Math.PI * 2 - Math.PI / 2;
                const rx = cx + Math.cos(angle) * (radius * 0.7);
                const ry = cy + Math.sin(angle) * (radius * 0.7);

                // Connector line
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(rx, ry);
                ctx.strokeStyle = 'rgba(33, 150, 243, 0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Reservoir Node
                ctx.beginPath();
                ctx.arc(rx, ry, 36, 0, Math.PI * 2);
                ctx.fillStyle = '#121824';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#2196f3';
                ctx.stroke();

                // Text
                ctx.fillStyle = '#e0e0e0';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(key, rx, ry - 4);
                ctx.fillStyle = '#4caf50';
                ctx.fillText(Number(reservoirs[key]).toFixed(0), rx, ry + 12);
            });
        }

        updateUI();
        render();
    </script>
</body>
</html>
