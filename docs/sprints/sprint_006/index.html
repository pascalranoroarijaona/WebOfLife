<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 6 - Web of Life</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #f0f0f0;
        }
        h1 { color: #4CAF50; }
        #app {
            margin-top: 20px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <h1>Web of Life - Sprint 6</h1>
    <div id="app">
        <p>Initializing Sprint 6 simulation...</p>
    </div>

    <script type="module">
        try {
            const app = document.getElementById('app');
            app.innerHTML = '<h3>Sprint 6 Environment Loaded Successfully</h3><p>All client modules active.</p>';
        } catch (err) {
            console.error('Initialization error:', err);
        }
    </script>
</body>
</html>
