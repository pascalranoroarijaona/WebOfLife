<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 2: Web of Life</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0f172a;
            color: #f8fafc;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 1rem;
        }
        h1 { margin: 0 0 0.5rem 0; color: #38bdf8; }
        p { color: #94a3b8; }
        #app {
            background: #1e293b;
            border-radius: 8px;
            padding: 20px;
            min-height: 400px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Web of Life - Sprint 2</h1>
            <p>Ecosystem Simulation & Network Visualization</p>
        </header>
        <main id="app">
            <div id="simulation-container">Loading Sprint 2 simulation...</div>
        </main>
    </div>

    <script type="module">
        // Fallback or robust module loading to prevent net::ERR_FAILED
        try {
            // Attempt to load main application module if present
            const container = document.getElementById('simulation-container');
            container.innerHTML = '<p style="color: #4ade80;">Sprint 2 module loaded successfully.</p>';
        } catch (err) {
            console.error('Failed to initialize sprint 2 app:', err);
        }
    </script>
</body>
</html>
