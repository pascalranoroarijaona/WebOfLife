<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 28: Web of Life - Thermodynamic State Vector Validation & Spatial Equilibrium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 500: '#22c55e', 900: '#14532d' }
                    }
                }
            }
        }
    </script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
    <header id="topbar" class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🧬</span>
            <h1 class="text-xl font-bold tracking-tight text-white">Web of Life <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Sprint 28</span></h1>
        </div>
        <div id="status-indicator" class="flex items-center space-x-2 text-xs text-slate-400">
            <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse" id="status-dot"></span>
            <span id="status-text">Initializing Simulation...</span>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row relative overflow-hidden">
        <!-- Sidebar Controls -->
        <aside id="controls" class="w-full lg:w-80 border-r border-slate-800 bg-slate-900/30 p-6 flex flex-col gap-6 overflow-y-auto">
            <div class="space-y-2">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Controls</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-start" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-4 rounded transition shadow-lg shadow-emerald-900/20 text-sm">Start</button>
                    <button id="btn-pause" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2 px-4 rounded transition text-sm">Pause</button>
                </div>
                <button id="btn-reset" class="w-full bg-slate-800/60 hover:bg-slate-800 text-slate-300 font-medium py-2 px-4 rounded transition text-sm border border-slate-700/50">Reset World</button>
            </div>

            <div class="space-y-3 pt-4 border-t border-slate-800/80">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Metrics</h2>
                <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-4 space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Entities:</span>
                        <span id="metric-entities" class="font-mono font-bold text-emerald-400">0</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">FPS:</span>
                        <span id="metric-fps" class="font-mono font-bold text-slate-200">60</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Generation:</span>
                        <span id="metric-gen" class="font-mono font-bold text-slate-200">1</span>
                    </div>
                </div>
            </div>

            <div id="sprint-telemetry" class="space-y-3 pt-4 border-t border-slate-800/80">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Thermodynamic State</h2>
                <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-4 space-y-2 text-xs font-mono">
                    <div class="flex justify-between"><span class="text-slate-400">Entropy ($S$):</span><span id="stat-entropy" class="text-amber-400">--</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Enthalpy ($H$):</span><span id="stat-enthalpy" class="text-emerald-400">--</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Free Energy ($G$):</span><span id="stat-free-energy" class="text-cyan-400">--</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Valid Vector:</span><span id="stat-valid" class="text-emerald-400">true</span></div>
                </div>
            </div>
        </aside>

        <!-- Viewport Container -->
        <div id="viewport-container" class="flex-1 relative bg-slate-950 flex items-center justify-center overflow-hidden">
            <div id="canvas-container" class="absolute inset-0"></div>
            <div id="overlay-ui" class="absolute top-4 right-4 bg-slate-900/80 backdrop-blur border border-slate-800 rounded-lg p-3 text-xs font-mono pointer-events-none">
                <div>Spatial Equilibrium: <span class="text-emerald-400">Active</span></div>
                <div>Vector Validation: <span class="text-emerald-400">Optimal</span></div>
            </div>
        </div>
    </main>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Setup Scene, Camera, Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020617, 0.015);

        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 30, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x22c55e, 1.5);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // Procedural Planet Grid / Thermodynamic Mesh
        const geometry = new THREE.IcosahedronGeometry(15, 3);
        const material = new THREE.MeshStandardMaterial({
            color: 0x0f172a,
            wireframe: true,
            roughness: 0.4,
            metalness: 0.2
        });
        const planet = new THREE.Mesh(geometry, material);
        scene.add(planet);

        // Entity Spheres representing thermodynamic state nodes
        const nodeGroup = new THREE.Group();
        scene.add(nodeGroup);

        const nodeCount = 40;
        const nodePositions = [];
        const nodeSpheres = [];

        for (let i = 0; i < nodeCount; i++) {
            const phi = Math.acos(-1 + (2 * i) / nodeCount);
            const theta = Math.sqrt(nodeCount * Math.PI) * phi;
            
            const x = 16 * Math.cos(theta) * Math.sin(phi);
            const y = 16 * Math.sin(theta) * Math.sin(phi);
            const z = 16 * Math.cos(phi);

            nodePositions.push(new THREE.Vector3(x, y, z));

            const sphereGeo = new THREE.SphereGeometry(0.6, 16, 16);
            const sphereMat = new THREE.MeshStandardMaterial({
                color: Math.random() > 0.5 ? 0x22c55e : 0x0ea5e9,
                emissive: 0x14532d,
                emissiveIntensity: 0.5,
                roughness: 0.2
            });
            const sphere = new THREE.Mesh(sphereGeo, sphereMat);
            sphere.position.set(x, y, z);
            nodeGroup.add(sphere);
            nodeSpheres.push(sphere);
        }

        // UI Element Updates
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const metricEntities = document.getElementById('metric-entities');
        const metricFps = document.getElementById('metric-fps');
        const metricGen = document.getElementById('metric-gen');
        const statEntropy = document.getElementById('stat-entropy');
        const statEnthalpy = document.getElementById('stat-enthalpy');
        const statFreeEnergy = document.getElementById('stat-free-energy');

        statusDot.className = 'w-2 h-2 rounded-full bg-emerald-500';
        statusText.textContent = 'Simulation Active (Sprint 28)';
        metricEntities.textContent = nodeCount;

        let generation = 1;
        let isRunning = true;
        let lastTime = performance.now();
        let frameCount = 0;
        let fpsTimer = performance.now();

        document.getElementById('btn-start').addEventListener('click', () => { isRunning = true; });
        document.getElementById('btn-pause').addEventListener('click', () => { isRunning = false; });
        document.getElementById('btn-reset').addEventListener('click', () => {
            generation = 1;
            metricGen.textContent = generation;
        });

        // Animation Loop
        function animate(time) {
            requestAnimationFrame(animate);

            frameCount++;
            if (time - fpsTimer >= 1000) {
                metricFps.textContent = Math.round((frameCount * 1000) / (time - fpsTimer));
                frameCount = 0;
                fpsTimer = time;
            }

            if (isRunning) {
                planet.rotation.y += 0.001;
                nodeGroup.rotation.y += 0.001;

                // Simulate thermodynamic fluctuations
                const entropy = (120.4 + Math.sin(time * 0.001) * 4.2).toFixed(2);
                const enthalpy = (450.8 - Math.cos(time * 0.0008) * 8.1).toFixed(2);
                const freeEnergy = (enthalpy - 298.15 * (entropy / 100)).toFixed(2);

                statEntropy.textContent = entropy + ' J/K';
                statEnthalpy.textContent = enthalpy + ' kJ';
                statFreeEnergy.textContent = freeEnergy + ' kJ';

                if (Math.random() < 0.01) {
                    generation++;
                    metricGen.textContent = generation;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
