<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 9: Web of Life - Advanced Simulation & Ecosystem Dynamics</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        wol: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-wol-500/10 rounded-lg border border-wol-500/20">
                    <i data-lucide="network" class="w-6 h-6 text-wol-500"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Web of Life</h1>
                    <p class="text-xs text-slate-400">Sprint 9: Ecosystem Simulation & Analytics</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <a href="../sprint_008/index.html" class="px-3 py-1.5 text-xs font-medium rounded-md bg-slate-800 hover:bg-slate-700 transition">← Sprint 8</a>
                <span class="px-3 py-1.5 text-xs font-semibold rounded-full bg-wol-500/10 text-wol-500 border border-wol-500/20">Active Sprint</span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Left Sidebar: Controls & Stats -->
        <section class="lg:col-span-1 space-y-6">
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 shadow-xl">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-4 flex items-center">
                    <i data-lucide="sliders" class="w-4 h-4 mr-2 text-wol-500"></i> Simulation Controls
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Population Density</label>
                        <input type="range" id="densityRange" min="10" max="500" value="150" class="w-full accent-wol-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Mutation Rate</label>
                        <input type="range" id="mutationRange" min="0" max="100" value="15" class="w-full accent-wol-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 pt-2">
                        <button id="startBtn" class="flex items-center justify-center space-x-1 py-2 px-4 bg-wol-600 hover:bg-wol-500 text-white rounded-lg font-medium text-sm transition shadow-lg shadow-wol-600/20">
                            <i data-lucide="play" class="w-4 h-4"></i>
                            <span>Start</span>
                        </button>
                        <button id="resetBtn" class="flex items-center justify-center space-x-1 py-2 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-medium text-sm transition border border-slate-700">
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                            <span>Reset</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 shadow-xl">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-3 flex items-center">
                    <i data-lucide="activity" class="w-4 h-4 mr-2 text-wol-500"></i> Ecosystem Health
                </h2>
                <div class="space-y-3">
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-slate-400">Biodiversity Index</span>
                            <span id="biodiversityVal" class="font-mono text-wol-500 font-semibold">88%</span>
                        </div>
                        <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                            <div id="biodiversityBar" class="bg-wol-500 h-full rounded-full transition-all duration-300" style="width: 88%"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-slate-400">Energy Equilibrium</span>
                            <span id="energyVal" class="font-mono text-wol-500 font-semibold">94%</span>
                        </div>
                        <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                            <div id="energyBar" class="bg-wol-500 h-full rounded-full transition-all duration-300" style="width: 94%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Center/Right Viewport: Three.js Simulation Canvas -->
        <section class="lg:col-span-3 bg-slate-900/80 border border-slate-800 rounded-xl p-4 flex flex-col shadow-xl relative min-h-[500px]">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider flex items-center">
                    <i data-lucide="globe" class="w-4 h-4 mr-2 text-wol-500"></i> 3D Biosphere Visualization
                </h2>
                <div class="flex items-center space-x-2 text-xs text-slate-400">
                    <span class="inline-block w-2 h-2 rounded-full bg-wol-500 animate-pulse"></span>
                    <span id="fpsCounter">60 FPS</span>
                </div>
            </div>

            <!-- Canvas Container -->
            <div id="canvasContainer" class="flex-1 w-full h-[450px] bg-slate-950 rounded-lg relative overflow-hidden border border-slate-800">
                <!-- Three.js appended canvas goes here -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 mt-auto py-4 text-center text-xs text-slate-500">
        Web of Life Ecosystem Simulation Engine &bull; Sprint 9 Production Build
    </footer>

    <!-- Client-Side Initialization Script -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Three.js Scene Setup
        const container = document.getElementById('canvasContainer');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020617);

        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 30, 50);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // Add Ambient & Directional Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // Create Ecosystem Grid / Particles
        const geometry = new THREE.BufferGeometry();
        const count = 150;
        const positions = new Float32Array(count * 3);

        for (let i = 0; i < count * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 40;
            positions[i+1] = (Math.random() - 0.5) * 10;
            positions[i+2] = (Math.random() - 0.5) * 40;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({ color: 0x22c55e, size: 0.8 });
        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // Animation Loop
        let isRunning = true;
        let frameCount = 0;
        let lastTime = performance.now();

        function animate() {
            if (!isRunning) return;
            requestAnimationFrame(animate);

            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                document.getElementById('fpsCounter').innerText = `${frameCount} FPS`;
                frameCount = 0;
                lastTime = now;
            }

            particleSystem.rotation.y += 0.002;
            renderer.render(scene, camera);
        }

        animate();

        // UI Controls Interaction
        document.getElementById('startBtn').addEventListener('click', () => {
            isRunning = !isRunning;
            const btn = document.getElementById('startBtn');
            if (isRunning) {
                btn.innerHTML = '<i data-lucide="pause" class="w-4 h-4"></i><span>Pause</span>';
                animate();
            } else {
                btn.innerHTML = '<i data-lucide="play" class="w-4 h-4"></i><span>Start</span>';
            }
            lucide.createIcons();
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            particleSystem.rotation.set(0, 0, 0);
            document.getElementById('densityRange').value = 150;
            document.getElementById('mutationRange').value = 15;
            document.getElementById('biodiversityVal').innerText = '88%';
            document.getElementById('biodiversityBar').style.width = '88%';
            document.getElementById('energyVal').innerText = '94%';
            document.getElementById('energyBar').style.width = '94%';
        });

        // Window Resize Handling
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
