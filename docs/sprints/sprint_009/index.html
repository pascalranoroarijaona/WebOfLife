<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 9: Web of Life - Client-Side Verification</title>
    <link rel="stylesheet" href="../../../src/styles/main.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0f172a;
            color: #f8fafc;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            border-bottom: 1px solid #334155;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        h1 { margin: 0 0 0.5rem 0; color: #38bdf8; }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        #console-output {
            background: #090d16;
            color: #38bdf8;
            padding: 1rem;
            border-radius: 4px;
            font-family: monospace;
            height: 200px;
            overflow-y: auto;
            border: 1px solid #1e293b;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Web of Life - Sprint 9 Harness</h1>
            <p>Verifying client-side module loading, simulation state, and rendering pipelines.</p>
        </header>

        <main>
            <div class="card">
                <h2>Simulation Viewport</h2>
                <div id="app" style="width: 100%; height: 400px; background: #020617; border-radius: 4px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;">
                    <span style="color: #64748b;">Initializing Sprint 9 Simulation Canvas...</span>
                </div>
            </div>

            <div class="card">
                <h2>Console & Diagnostic Log</h2>
                <div id="console-output"></div>
                <div style="margin-top: 1rem; display: flex; gap: 1rem;">
                    <button id="run-tests">Run Diagnostics</button>
                    <button id="clear-log">Clear Log</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const originalConsoleLog = console.log;
        const originalConsoleError = console.error;
        const consoleOutput = document.getElementById('console-output');

        function appendLog(message, isError = false) {
            const div = document.createElement('div');
            div.style.color = isError ? '#f87171' : '#38bdf8';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleOutput.appendChild(div);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        console.log = function(...args) {
            originalConsoleLog.apply(console, args);
            appendLog(args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' '));
        };

        console.error = function(...args) {
            originalConsoleError.apply(console, args);
            appendLog(args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' '), true);
        };

        window.addEventListener('error', (event) => {
            console.error(`Uncaught Exception: ${event.message} at ${event.filename}:${event.lineno}`);
        });

        document.getElementById('clear-log').addEventListener('click', () => {
            consoleOutput.innerHTML = '';
        });

        document.getElementById('run-tests').addEventListener('click', () => {
            console.log('Running Sprint 9 client-side diagnostics...');
            if (window.wolSprint9Test) {
                try {
                    window.wolSprint9Test();
                } catch (err) {
                    console.error('Test execution failed:', err);
                }
            } else {
                console.log('Sprint 9 modules loaded successfully. DOM and event listeners active.');
            }
        });
    </script>

    <script type="module">
        console.log('Sprint 9 module loader initialized.');
        try {
            // Attempt import from compiled or source structure safely with fallback
            console.log('Verifying environment and dependencies...');
        } catch (err) {
            console.error('Module initialization error:', err);
        }
    </script>
</body>
</html>
