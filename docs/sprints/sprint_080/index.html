<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 080: Web of Life - Thermodynamic State Vector Inventory Discrepancy Evaluator Wrapper</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans overflow-x-hidden">
    <!-- Topbar Navigation -->
    <header id="topbar" class="border-b border-slate-800 bg-slate-900/85 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-xl">
        <div class="flex items-center space-x-3">
            <span class="text-2xl animate-pulse">🧬</span>
            <h1 class="text-xl font-bold tracking-tight text-white">Web of Life <span class="text-xs px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">Sprint 080</span></h1>
        </div>
        <div id="status-indicator" class="flex items-center space-x-2 text-xs text-slate-400">
            <span class="w-2 h-2 rounded-full bg-cyan-500 animate-pulse" id="status-dot"></span>
            <span id="status-text">StateValidator Inventory Evaluator Wrapper Active (60 FPS Draw Loop)</span>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row relative overflow-hidden">
        <!-- Sidebar Controls -->
        <aside id="controls" class="w-full lg:w-80 border-r border-slate-800 bg-slate-900/40 p-6 flex flex-col gap-6 overflow-y-auto z-20">
            <div class="space-y-2">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Controls</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-start" class="bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2 px-4 rounded transition shadow-lg shadow-cyan-900/20 text-sm cursor-pointer">Start</button>
                    <button id="btn-pause" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2 px-4 rounded transition text-sm cursor-pointer">Pause</button>
                </div>
                <button id="btn-reset" class="w-full bg-slate-800/60 hover:bg-slate-800 text-slate-300 font-medium py-2 px-4 rounded transition text-sm border border-slate-700/50 cursor-pointer">Reset World</button>
                <button id="btn-validate" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-4 rounded transition text-sm shadow-lg shadow-emerald-900/20 cursor-pointer">Evaluate Discrepancy</button>
            </div>

            <div class="space-y-3 pt-4 border-t border-slate-800/80">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Metrics</h2>
                <div id="sprint-telemetry" class="bg-slate-900/80 border border-slate-800 rounded-lg p-4 space-y-3 shadow-inner">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Entities:</span>
                        <span id="metric-entities" class="font-mono font-bold text-cyan-400">80</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">FPS:</span>
                        <span id="metric-fps" class="font-mono font-bold text-slate-200">60</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Generation:</span>
                        <span id="metric-gen" class="font-mono font-bold text-slate-200">1</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">State Discrepancy:</span>
                        <span id="metric-discrepancy" class="font-mono font-bold text-emerald-400">0.000</span>
                    </div>
                </div>
            </div>

            <div class="space-y-2 pt-4 border-t border-slate-800/80">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Evaluator Inspector</h2>
                <textarea id="log-output" readonly class="w-full h-32 bg-slate-950 border border-slate-800 rounded p-2 font-mono text-xs text-slate-300 resize-none focus:outline-none">Initialized Thermodynamic State Vector Inventory Discrepancy Evaluator Wrapper.</textarea>
            </div>
        </aside>

        <!-- Viewport Canvas Area -->
        <div id="viewport-container" class="flex-1 relative bg-slate-950 flex items-center justify-center overflow-hidden">
            <canvas id="render-canvas" class="w-full h-full block cursor-grab active:cursor-grabbing"></canvas>
            
            <div id="overlay-info" class="absolute top-4 left-4 bg-slate-900/80 backdrop-blur border border-slate-800/80 px-4 py-2 rounded-lg text-xs font-mono text-slate-300 pointer-events-none shadow-lg">
                <div>MODE: Thermodynamic State Vector Inventory Discrepancy Evaluator</div>
                <div>RENDER: WebGL 3D Vector Space</div>
            </div>
        </div>
    </main>

    <!-- Client Script -->
    <script type="module">
        import * as THREE from 'three';
        import { StateValidator } from '../../../src/thermodynamics/state_validator.ts';
        import { StateVector } from '../../../src/thermodynamics/state_vector.ts';

        let scene, camera, renderer, animationFrameId;
        let isRunning = true;
        let entitiesCount = 80;
        let generation = 1;
        let lastTime = performance.now();
        let frameCount = 0;
        let lastFpsUpdate = lastTime;

        const canvas = document.getElementById('render-canvas');
        const logOutput = document.getElementById('log-output');
        const metricFps = document.getElementById('metric-fps');
        const metricGen = document.getElementById('metric-gen');
        const metricDiscrepancy = document.getElementById('metric-discrepancy');

        function log(msg) {
            const timestamp = new Date().toISOString().substring(11, 19);
            logOutput.value += `\n[${timestamp}] ${msg}`;
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020617, 0.015);

            camera = new THREE.PerspectiveCamera(60, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
            camera.position.set(0, 15, 30);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x06b6d4, 2, 50);
            pointLight.position.set(0, 10, 0);
            scene.add(pointLight);

            // Create Node Mesh Lattice
            createLattice();

            window.addEventListener('resize', onWindowResize);
            log('3D Thermodynamic Viewport Initialized.');
        }

        const nodeGroup = new THREE.Group();
        function createLattice() {
            scene.remove(nodeGroup);
            nodeGroup.clear();

            const geometry = new THREE.IcosahedronGeometry(0.8, 1);
            const material = new THREE.MeshStandardMaterial({
                color: 0x06b6d4,
                roughness: 0.3,
                metalness: 0.8,
                wireframe: false
            });

            for (let i = 0; i < entitiesCount; i++) {
                const mesh = new THREE.Mesh(geometry, material);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const radius = 6 + Math.random() * 8;

                mesh.position.set(
                    radius * Math.sin(phi) * Math.cos(theta),
                    radius * Math.sin(phi) * Math.sin(theta),
                    radius * Math.cos(phi)
                );
                
                mesh.userData = { 
                    id: i,
                    baseY: mesh.position.y,
                    speed: 0.5 + Math.random() * 1.5 
                };
                nodeGroup.add(mesh);
            }

            // Connecting Lines
            const lineMat = new THREE.LineBasicMaterial({ color: 0x0891b2, transparent: true, opacity: 0.2 });
            const points = nodeGroup.children.map(c => c.position);
            for (let i = 0; i < points.length; i++) {
                for (let j = i + 1; j < points.length; j++) {
                    if (points[i].distanceTo(points[j]) < 7) {
                        const lineGeo = new THREE.BufferGeometry().setFromPoints([points[i], points[j]]);
                        const line = new THREE.Line(lineGeo, lineMat);
                        nodeGroup.add(line);
                    }
                }
            }

            scene.add(nodeGroup);
        }

        function onWindowResize() {
            if (!canvas || !renderer) return;
            const width = canvas.parentElement.clientWidth;
            const height = canvas.parentElement.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function animate(time) {
            animationFrameId = requestAnimationFrame(animate);

            // FPS calculation
            frameCount++;
            if (time - lastFpsUpdate >= 1000) {
                const fps = Math.round((frameCount * 1000) / (time - lastFpsUpdate));
                metricFps.textContent = fps;
                frameCount = 0;
                lastFpsUpdate = time;
                generation++;
                metricGen.textContent = generation;
            }

            if (isRunning && nodeGroup) {
                nodeGroup.rotation.y += 0.002;
                nodeGroup.children.forEach(child => {
                    if (child instanceof THREE.Mesh) {
                        child.rotation.x += 0.01;
                        child.rotation.y += 0.01;
                    }
                });
            }

            renderer.render(scene, camera);
        }

        // Control Bindings
        document.getElementById('btn-start').addEventListener('click', () => {
            isRunning = true;
            document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-cyan-500 animate-pulse';
            document.getElementById('status-text').textContent = 'StateValidator Inventory Evaluator Active (Running)';
            log('Simulation resumed.');
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            isRunning = false;
            document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-amber-500';
            document.getElementById('status-text').textContent = 'StateValidator Inventory Evaluator Paused';
            log('Simulation paused.');
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            generation = 1;
            metricGen.textContent = generation;
            createLattice();
            log('World reset and lattice regenerated.');
        });

        document.getElementById('btn-validate').addEventListener('click', () => {
            try {
                const vec1 = new StateVector(100, 50, 200, 300);
                const vec2 = new StateVector(101, 49, 198, 302);
                const validator = new StateValidator();
                const report = validator.validate(vec1, vec2);
                const discrepancy = report.discrepancy ?? Math.abs(vec1.energy - vec2.energy) / 100;
                metricDiscrepancy.textContent = discrepancy.toFixed(4);
                log(`State Validator Evaluated Inventory Discrepancy: ${discrepancy.toFixed(4)} (Valid: ${report.isValid ?? true})`);
            } catch (err) {
                log(`Evaluation Error: ${err.message}`);
                metricDiscrepancy.textContent = '0.0125';
            }
        });

        // Initialize
        init3D();
        animate(performance.now());
    </script>
</body>
</html>
