<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 7: Web of Life - Interactive Simulation & Refinement</title>
    <link rel="stylesheet" href="../../styles.css">
    <style>
        :root {
            --primary-color: #2e7d32;
            --secondary-color: #81c784;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #aaa;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--secondary-color);
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: var(--secondary-color);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .sprint-header {
            margin-bottom: 2rem;
        }

        .sprint-header h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .sprint-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .simulation-container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .simulation-container {
                grid-template-columns: 1fr;
            }
        }

        .canvas-wrapper {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 500px;
        }

        canvas {
            display: block;
            background-color: #0a0a0a;
            width: 100%;
            height: 100%;
        }

        .controls-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .btn-row {
            display: flex;
            gap: 0.5rem;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
            flex: 1;
        }

        button:hover {
            background-color: #388e3c;
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background-color: #333;
            color: var(--text-color);
        }

        button.secondary:hover {
            background-color: #444;
        }

        .stats-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .stat-row:last-child {
            margin-bottom: 0;
        }

        .stat-value {
            font-weight: bold;
            color: var(--secondary-color);
        }

        footer {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Web of Life</h1>
        <nav>
            <a href="../../index.html">Home</a>
            <a href="../sprint_006/index.html">Sprint 6</a>
            <a href="#" class="active">Sprint 7</a>
        </nav>
    </header>

    <main>
        <div class="sprint-header">
            <h2>Sprint 7: Ecosystem Dynamics & Optimization</h2>
            <p>Advanced simulation testing environmental stress, population curves, and feedback loops.</p>
        </div>

        <div class="simulation-container">
            <div class="canvas-wrapper">
                <canvas id="simCanvas" width="800" height="600"></canvas>
            </div>

            <div class="controls-panel">
                <div class="control-group">
                    <label>Simulation Controls</label>
                    <div class="btn-row">
                        <button id="btnPlay">Pause</button>
                        <button id="btnReset" class="secondary">Reset</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Environment Parameters</label>
                    <button id="btnToggleStress" class="secondary">Trigger Drought</button>
                </div>

                <div class="control-group">
                    <label>Ecosystem Metrics</label>
                    <div class="stats-box">
                        <div class="stat-row">
                            <span>FPS:</span>
                            <span id="statFps" class="stat-value">60</span>
                        </div>
                        <div class="stat-row">
                            <span>Producers (Plants):</span>
                            <span id="statPlants" class="stat-value">0</span>
                        </div>
                        <div class="stat-row">
                            <span>Herbivores:</span>
                            <span id="statHerbivores" class="stat-value">0</span>
                        </div>
                        <div class="stat-row">
                            <span>Carnivores:</span>
                            <span id="statCarnivores" class="stat-value">0</span>
                        </div>
                        <div class="stat-row">
                            <span>Stress Level:</span>
                            <span id="statStress" class="stat-value">Normal</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; Web of Life Project. Sprint 7 Environment.</p>
    </footer>

    <script>
        // Sprint 7 Simulation Script
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('simCanvas');
            const ctx = canvas.getContext('2d');

            let isRunning = true;
            let droughtActive = false;
            let lastTime = performance.now();
            let frameCount = 0;
            let fps = 60;

            // Entities
            let entities = [];

            class Entity {
                constructor(x, y, type) {
                    this.x = x;
                    this.y = y;
                    this.type = type; // 'plant', 'herbivore', 'carnivore'
                    this.energy = 100;
                    this.radius = type === 'plant' ? 4 : (type === 'herbivore' ? 6 : 8);
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = (Math.random() - 0.5) * 2;
                }

                update() {
                    if (this.type !== 'plant') {
                        this.x += this.vx;
                        this.y += this.vy;

                        // Bounce off walls
                        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                        this.energy -= droughtActive ? 0.5 : 0.2;
                    } else {
                        if (droughtActive && Math.random() < 0.05) {
                            this.energy -= 5;
                        }
                    }
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    if (this.type === 'plant') {
                        ctx.fillStyle = droughtActive ? '#8d6e63' : '#4caf50';
                    } else if (this.type === 'herbivore') {
                        ctx.fillStyle = '#ffb74d';
                    } else {
                        ctx.fillStyle = '#e57373';
                    }
                    ctx.fill();
                    ctx.closePath();
                }
            }

            function initSimulation() {
                entities = [];
                // Add plants
                for (let i = 0; i < 60; i++) {
                    entities.push(new Entity(Math.random() * canvas.width, Math.random() * canvas.height, 'plant'));
                }
                // Add herbivores
                for (let i = 0; i < 20; i++) {
                    entities.push(new Entity(Math.random() * canvas.width, Math.random() * canvas.height, 'herbivore'));
                }
                // Add carnivores
                for (let i = 0; i < 5; i++) {
                    entities.push(new Entity(Math.random() * canvas.width, Math.random() * canvas.height, 'carnivore'));
                }
            }

            function updateStats() {
                let plants = entities.filter(e => e.type === 'plant' && e.energy > 0).length;
                let herbivores = entities.filter(e => e.type === 'herbivore' && e.energy > 0).length;
                let carnivores = entities.filter(e => e.type === 'carnivore' && e.energy > 0).length;

                document.getElementById('statPlants').textContent = plants;
                document.getElementById('statHerbivores').textContent = herbivores;
                document.getElementById('statCarnivores').textContent = carnivores;
                document.getElementById('statFps').textContent = Math.round(fps);
                document.getElementById('statStress').textContent = droughtActive ? 'Drought (High)' : 'Normal';
            }

            function loop(now) {
                // Calculate FPS
                frameCount++;
                if (now - lastTime >= 1000) {
                    fps = frameCount;
                    frameCount = 0;
                    lastTime = now;
                }

                if (isRunning) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    // Update and draw entities
                    entities.forEach(e => {
                        e.update();
                        e.draw();
                    });

                    // Remove dead entities
                    entities = entities.filter(e => e.energy > 0);

                    // Respawn plants slowly
                    if (Math.random() < 0.1 && entities.filter(e => e.type === 'plant').length < 80) {
                        entities.push(new Entity(Math.random() * canvas.width, Math.random() * canvas.height, 'plant'));
                    }

                    updateStats();
                }

                requestAnimationFrame(loop);
            }

            // UI Listeners
            const btnPlay = document.getElementById('btnPlay');
            btnPlay.addEventListener('click', () => {
                isRunning = !isRunning;
                btnPlay.textContent = isRunning ? 'Pause' : 'Play';
                btnPlay.classList.toggle('secondary', !isRunning);
            });

            document.getElementById('btnReset').addEventListener('click', () => {
                initSimulation();
            });

            const btnToggleStress = document.getElementById('btnToggleStress');
            btnToggleStress.addEventListener('click', () => {
                droughtActive = !droughtActive;
                btnToggleStress.textContent = droughtActive ? 'End Drought' : 'Trigger Drought';
                btnToggleStress.classList.toggle('secondary', !droughtActive);
            });

            // Start
            initSimulation();
            requestAnimationFrame(loop);
        });
    </script>
</body>
</html>
