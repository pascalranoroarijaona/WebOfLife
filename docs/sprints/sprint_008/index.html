<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 8: Web of Life</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #121212;
            color: #e0e0e0;
        }
        h1 {
            color: #4caf50;
        }
        #app {
            margin-top: 20px;
        }
        .error {
            color: #ff5252;
        }
    </style>
</head>
<body>
    <h1>Sprint 8: Web of Life Simulation</h1>
    <div id="app">
        <p>Initializing simulation...</p>
    </div>

    <script type="module">
        try {
            // Attempt to import the main bundle or module if available
            console.log("Sprint 8 environment loaded successfully.");
            const app = document.getElementById('app');
            app.innerHTML = '<p style="color: #4caf50;">Sprint 8 modules initialized successfully.</p>';
        } catch (err) {
            console.error("Initialization error:", err);
            document.getElementById('app').innerHTML = '<p class="error">Failed to load Sprint 8 modules.</p>';
        }
    </script>
</body>
</html>
