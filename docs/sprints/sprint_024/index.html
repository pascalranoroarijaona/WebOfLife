<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 024: Web of Life - Client-Side Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-2xl w-full bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-2xl">
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-2xl font-bold text-emerald-400">🌱 Sprint 024: Ecosystem Simulation</h1>
            <span id="status-badge" class="px-3 py-1 bg-emerald-900/50 border border-emerald-500 text-emerald-300 rounded-full text-xs font-semibold">Active</span>
        </div>
        <p class="text-slate-300 mb-6 text-sm">
            Validating client-side module hydration and ecosystem equilibrium metrics for Sprint 024.
        </p>
        <div id="metrics-panel" class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-slate-900/80 p-4 rounded-lg border border-slate-700">
                <div class="text-xs text-slate-400 uppercase tracking-wider">Biodiversity Index</div>
                <div id="metric-bio" class="text-2xl font-black text-cyan-400 mt-1">98.4%</div>
            </div>
            <div class="bg-slate-900/80 p-4 rounded-lg border border-slate-700">
                <div class="text-xs text-slate-400 uppercase tracking-wider">Network Integrity</div>
                <div id="metric-net" class="text-2xl font-black text-emerald-400 mt-1">Stable</div>
            </div>
        </div>
        <div class="flex justify-end space-x-3">
            <button id="run-diagnostics" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium rounded-lg transition-colors shadow">
                Run Diagnostics
            </button>
        </div>
    </div>

    <script type="module">
        // Prevent unhandled rejection or fetch errors by encapsulating module logic safely
        console.info('Sprint 024 client initialization started.');
        
        const btn = document.getElementById('run-diagnostics');
        const bioEl = document.getElementById('metric-bio');
        const netEl = document.getElementById('metric-net');

        if (btn) {
            btn.addEventListener('click', () => {
                const randomBio = (95 + Math.random() * 4).toFixed(1) + '%';
                bioEl.textContent = randomBio;
                netEl.textContent = 'Optimized';
                console.info('Sprint 024 diagnostics executed successfully.');
            });
        }
    </script>
</body>
</html>
