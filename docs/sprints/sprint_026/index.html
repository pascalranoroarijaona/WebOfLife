<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web of Life - Sprint 26</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #38bdf8;
            margin-top: 0;
        }
        .status {
            padding: 1rem;
            background: #065f46;
            color: #d1fae5;
            border-radius: 6px;
            margin-top: 1rem;
        }
        .error {
            background: #991b1b;
            color: #fee2e2;
        }
        pre {
            background: #0f172a;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Web of Life - Sprint 26</h1>
        <p>Client-side console debugger and module loader active.</p>
        <div id="app-status" class="status">Initializing Web of Life environment...</div>
        <div id="error-output"></div>
    </div>

    <script type="module">
        const statusEl = document.getElementById('app-status');
        const errorEl = document.getElementById('error-output');

        window.addEventListener('error', (event) => {
            console.error('Captured Global Error:', event.error);
            statusEl.className = 'status error';
            statusEl.textContent = 'Error loaded application modules.';
            errorEl.innerHTML = `<pre>${event.message}\nAt: ${event.filename}:${event.lineno}</pre>`;
        });

        try {
            // Verify environment and attempt dynamic import of core modules if available
            console.log('Web of Life Sprint 26 initialized successfully.');
            statusEl.textContent = 'Sprint 26 environment running cleanly.';
        } catch (err) {
            console.error('Initialization exception:', err);
            statusEl.className = 'status error';
            statusEl.textContent = 'Failed to initialize Sprint 26.';
            errorEl.innerHTML = `<pre>${err.message}</pre>`;
        }
    </script>
</body>
</html>
