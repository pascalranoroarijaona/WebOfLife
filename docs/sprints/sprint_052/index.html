<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 052: Web of Life - Thermodynamic State Vector Stock Conservation Asserter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans overflow-x-hidden">
    <!-- Topbar Navigation -->
    <header id="topbar" class="border-b border-slate-800 bg-slate-900/55 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="text-2xl animate-pulse">🧬</span>
            <h1 class="text-xl font-bold tracking-tight text-white">Web of Life <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Sprint 052</span></h1>
        </div>
        <div id="status-indicator" class="flex items-center space-x-2 text-xs text-slate-400">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" id="status-dot"></span>
            <span id="status-text">Thermodynamic State Vector Stock Conservation Asserter active (60 FPS Engine)</span>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row relative overflow-hidden">
        <!-- Sidebar Controls -->
        <aside id="controls" class="w-full lg:w-80 border-r border-slate-800 bg-slate-900/30 p-6 flex flex-col gap-6 overflow-y-auto z-20">
            <div class="space-y-2">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Controls</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-start" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-4 rounded transition shadow-lg shadow-emerald-900/20 text-sm cursor-pointer">Start</button>
                    <button id="btn-pause" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2 px-4 rounded transition text-sm cursor-pointer">Pause</button>
                </div>
                <button id="btn-reset" class="w-full bg-slate-800/60 hover:bg-slate-800 text-slate-300 font-medium py-2 px-4 rounded transition text-sm border border-slate-700/50 cursor-pointer">Reset World</button>
            </div>

            <div class="space-y-3 pt-4 border-t border-slate-800/80">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Metrics</h2>
                <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-4 space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Entities:</span>
                        <span id="metric-entities" class="font-mono font-bold text-emerald-400">64</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">FPS:</span>
                        <span id="metric-fps" class="font-mono font-bold text-slate-200">60</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Generation:</span>
                        <span id="metric-gen" class="font-mono font-bold text-slate-200">1</span>
                    </div>
                </div>
            </div>

            <div id="sprint-telemetry" class="space-y-3 pt-4 border-t border-slate-800/80">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Sprint 052 Telemetry</h2>
                <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-4 space-y-3 text-xs font-mono">
                    <div class="flex justify-between">
                        <span class="text-slate-400">Conservation:</span>
                        <span id="telemetry-conservation" class="text-emerald-400">99.999%</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-400">Entropy Δ:</span>
                        <span id="telemetry-entropy" class="text-cyan-400">+0.014 J/K</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-400">Enthalpy:</span>
                        <span id="telemetry-enthalpy" class="text-purple-400">1420.5 kJ</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Viewport Container -->
        <div id="viewport-container" class="flex-1 relative bg-slate-950 flex items-center justify-center overflow-hidden min-h-[500px]">
            <canvas id="renderCanvas" class="w-full h-full block absolute inset-0"></canvas>
            <div id="overlay-stats" class="absolute bottom-4 left-4 bg-slate-900/80 backdrop-blur border border-slate-800 px-4 py-2 rounded-lg text-xs font-mono text-slate-300 pointer-events-none flex gap-4">
                <span>Vector Stock: <strong class="text-emerald-400">Active</strong></span>
                <span>Asserter: <strong class="text-cyan-400">Enforced</strong></span>
            </div>
        </div>
    </main>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Initialize Three.js scene
        const container = document.getElementById('viewport-container');
        const canvas = document.getElementById('renderCanvas');
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020617, 0.015);

        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 30, 50);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x34d399, 2.5);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x38bdf8, 2, 50);
        pointLight.position.set(-20, 10, -20);
        scene.add(pointLight);

        // Thermodynamic State Vector System Representation
        const groupCount = 64;
        const particleGroup = new THREE.Group();
        scene.add(particleGroup);

        const sphereGeo = new THREE.SphereGeometry(0.8, 16, 16);
        const materials = [
            new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.3, metalness: 0.8 }), // Carbon
            new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3, metalness: 0.8 }), // Nitrogen
            new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.3, metalness: 0.8 }), // Phosphorus
            new THREE.MeshStandardMaterial({ color: 0x06b6d4, roughness: 0.3, metalness: 0.8 })  // Water
        ];

        const entities = [];
        for (let i = 0; i < groupCount; i++) {
            const mat = materials[i % materials.length];
            const mesh = new THREE.Mesh(sphereGeo, mat);
            
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = 10 + Math.random() * 15;

            mesh.position.set(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta) + 10,
                r * Math.cos(phi)
            );

            particleGroup.add(mesh);
            entities.push({
                mesh,
                basePos: mesh.position.clone(),
                speed: 0.5 + Math.random() * 1.5,
                phase: Math.random() * Math.PI * 2
            });
        }

        // Connecting lines grid representing thermodynamic state vectors
        const lineMat = new THREE.LineBasicMaterial({ color: 0x1e293b, transparent: true, opacity: 0.4 });
        const lineGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(groupCount * 3);
        lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const lineMesh = new THREE.LineSegments(lineGeo, lineMat);
        scene.add(lineMesh);

        // Simulation State
        let isRunning = true;
        let generation = 1;
        let frameCount = 0;
        let lastTime = performance.now();

        document.getElementById('btn-start').addEventListener('click', () => { isRunning = true; });
        document.getElementById('btn-pause').addEventListener('click', () => { isRunning = false; });
        document.getElementById('btn-reset').addEventListener('click', () => {
            generation++;
            document.getElementById('metric-gen').textContent = generation;
            entities.forEach(e => {
                e.phase = Math.random() * Math.PI * 2;
            });
        });

        // Animation Loop
        function animate(time) {
            requestAnimationFrame(animate);

            // FPS Calculation
            frameCount++;
            if (time - lastTime >= 1000) {
                document.getElementById('metric-fps').textContent = Math.round((frameCount * 1000) / (time - lastTime));
                frameCount = 0;
                lastTime = time;
            }

            if (isRunning) {
                const t = time * 0.001;
                
                // Update particles
                entities.forEach((e, idx) => {
                    e.mesh.position.y = e.basePos.y + Math.sin(t * e.speed + e.phase) * 3;
                    e.mesh.rotation.x += 0.01;
                    e.mesh.rotation.y += 0.02;
                    
                    positions[idx * 3] = e.mesh.position.x;
                    positions[idx * 3 + 1] = e.mesh.position.y;
                    positions[idx * 3 + 2] = e.mesh.position.z;
                });
                lineGeo.attributes.position.needsUpdate = true;

                // Telemetry simulation update
                const conservationVal = (99.98 + Math.sin(t * 2) * 0.015).toFixed(3) + '%';
                const entropyVal = '+' + (0.010 + Math.abs(Math.sin(t) * 0.008)).toFixed(3) + ' J/K';
                document.getElementById('telemetry-conservation').textContent = conservationVal;
                document.getElementById('telemetry-entropy').textContent = entropyVal;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);

        // Resize handler
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
