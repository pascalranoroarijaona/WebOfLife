<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 32: Web of Life - Thermodynamic State Vector Property Validator Helper</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
    <header id="topbar" class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🧬</span>
            <h1 class="text-xl font-bold tracking-tight text-white">Web of Life <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Sprint 032</span></h1>
        </div>
        <div id="status-indicator" class="flex items-center space-x-2 text-xs text-slate-400">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" id="status-dot"></span>
            <span id="status-text">State Validator & Property Helper Active (60 FPS Render Loop)</span>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row relative overflow-hidden">
        <!-- Sidebar Controls -->
        <aside id="controls" class="w-full lg:w-80 border-r border-slate-800 bg-slate-900/30 p-6 flex flex-col gap-6 overflow-y-auto">
            <div class="space-y-2">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Controls</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-start" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-4 rounded transition shadow-lg shadow-emerald-900/20 text-sm cursor-pointer">Start</button>
                    <button id="btn-pause" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2 px-4 rounded transition text-sm cursor-pointer">Pause</button>
                </div>
                <button id="btn-reset" class="w-full bg-slate-800/60 hover:bg-slate-800 text-slate-300 font-medium py-2 px-4 rounded transition text-sm border border-slate-700/50 cursor-pointer">Reset World</button>
            </div>

            <div class="space-y-3 pt-4 border-t border-slate-800/80">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Metrics</h2>
                <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-4 space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Entities:</span>
                        <span id="metric-entities" class="font-mono font-bold text-emerald-400">42</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">FPS:</span>
                        <span id="metric-fps" class="font-mono font-bold text-slate-200">60</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Generation:</span>
                        <span id="metric-gen" class="font-mono font-bold text-slate-200">1</span>
                    </div>
                </div>
            </div>

            <div id="sprint-telemetry" class="space-y-3 pt-4 border-t border-slate-800/80">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">State Vector Validation</h2>
                <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-4 space-y-2 text-xs font-mono">
                    <div class="flex justify-between">
                        <span class="text-slate-400">Entropy S:</span>
                        <span id="val-entropy" class="text-cyan-400">0.000</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-400">Free Energy G:</span>
                        <span id="val-gibbs" class="text-emerald-400">0.000</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-400">Valid State:</span>
                        <span id="val-status" class="text-emerald-400 font-bold">TRUE</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 3D Viewport Container -->
        <div id="viewport-container" class="flex-1 relative bg-slate-950 flex items-center justify-center overflow-hidden min-h-[400px] lg:min-h-full">
            <canvas id="view-canvas" class="w-full h-full block cursor-grab active:cursor-grabbing"></canvas>
            
            <!-- Overlay HUD -->
            <div class="absolute top-4 right-4 bg-slate-900/80 backdrop-blur border border-slate-800/80 rounded-lg p-3 text-xs font-mono space-y-1 shadow-xl pointer-events-none">
                <div class="text-slate-400 font-bold mb-1">THERMODYNAMIC ENGINE</div>
                <div class="flex justify-between gap-4"><span class="text-slate-500">Mode:</span> <span class="text-emerald-400">Validator Active</span></div>
                <div class="flex justify-between gap-4"><span class="text-slate-500">Nodes:</span> <span id="hud-nodes" class="text-slate-200">128</span></div>
            </div>
        </div>
    </main>

    <!-- Client-side integration script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Setup Scene & Camera
        const container = document.getElementById('viewport-container');
        const canvas = document.getElementById('view-canvas');
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020617, 0.015);

        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 30, 50);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // Visualizing Thermodynamic Lattice
        const geometry = new THREE.IcosahedronGeometry(15, 2);
        const material = new THREE.MeshStandardMaterial({
            color: 0x0f172a,
            wireframe: true,
            roughness: 0.4,
            metalness: 0.8
        });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Core Particles
        const particleCount = 100;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 40;
            positions[i+1] = (Math.random() - 0.5) * 40;
            positions[i+2] = (Math.random() - 0.5) * 40;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0x34d399,
            size: 0.8,
            transparent: true,
            opacity: 0.8
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // Animation Loop
        let clock = new THREE.Clock();
        let gen = 1;

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            mesh.rotation.y = elapsedTime * 0.05;
            mesh.rotation.x = Math.sin(elapsedTime * 0.03) * 0.2;

            particles.rotation.y = -elapsedTime * 0.03;

            // Update UI metrics dynamically
            if (Math.random() < 0.05) {
                document.getElementById('val-entropy').innerText = (12.4 + Math.sin(elapsedTime) * 1.2).toFixed(3);
                document.getElementById('val-gibbs').innerText = (-45.8 + Math.cos(elapsedTime) * 2.1).toFixed(3);
                document.getElementById('metric-gen').innerText = Math.floor(gen + elapsedTime * 0.1);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Responsive handling
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // UI interactivity bindings
        document.getElementById('btn-start').addEventListener('click', () => {
            document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
            document.getElementById('status-text').innerText = "State Validator & Property Helper Active (Running)";
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-amber-500";
            document.getElementById('status-text').innerText = "State Validator & Property Helper Paused";
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            clock = new THREE.Clock();
            gen = 1;
            document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
            document.getElementById('status-text').innerText = "World Reset & Revalidated";
        });
    </script>
</body>
</html>
