<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 12: Web of Life Simulation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: auto;
            border: 1px solid #333;
        }
        h1 { margin: 0 0 10px 0; font-size: 18px; color: #4CAF50; }
        p { margin: 0 0 10px 0; font-size: 12px; color: #ccc; }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #45a049; }
    </style>
    <!-- Import map for robust module resolution -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-overlay">
        <h1>Web of Life - Sprint 12</h1>
        <p>Ecosystem Simulation active.</p>
        <button id="reset-btn">Reset Simulation</button>
    </div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Initialize Scene
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // Ground Grid
        const gridHelper = new THREE.GridHelper(100, 50, 0x444444, 0x222222);
        gridHelper.position.y = -0.01;
        scene.add(gridHelper);

        // Ecosystem Entities (Nodes)
        const nodeCount = 50;
        const nodes = [];
        const geometry = new THREE.SphereGeometry(0.8, 16, 16);

        for (let i = 0; i < nodeCount; i++) {
            const material = new THREE.MeshStandardMaterial({
                color: Math.random() > 0.5 ? 0x4CAF50 : 0x2196F3,
                roughness: 0.3,
                metalness: 0.2
            });
            const mesh = new THREE.Mesh(geometry, material);
            
            mesh.position.set(
                (Math.random() - 0.5) * 60,
                Math.random() * 5 + 1,
                (Math.random() - 0.5) * 60
            );

            scene.add(mesh);
            nodes.push({
                mesh,
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.05,
                    0,
                    (Math.random() - 0.5) * 0.05
                )
            });
        }

        // Window resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Reset button action
        document.getElementById('reset-btn').addEventListener('click', () => {
            nodes.forEach(n => {
                n.mesh.position.set(
                    (Math.random() - 0.5) * 60,
                    Math.random() * 5 + 1,
                    (Math.random() - 0.5) * 60
                );
            });
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            nodes.forEach(n => {
                n.mesh.position.add(n.velocity);
                if (Math.abs(n.mesh.position.x) > 35) n.velocity.x *= -1;
                if (Math.abs(n.mesh.position.z) > 35) n.velocity.z *= -1;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
