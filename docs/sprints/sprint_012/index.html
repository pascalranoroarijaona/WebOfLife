<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 012 - Web of Life</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 2rem;
        }
        h1 { color: #58a6ff; margin-top: 0; }
        .status {
            padding: 1rem;
            background: #21262d;
            border-left: 4px solid #3fb950;
            margin: 1rem 0;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sprint 012: Simulation Engine & Visualization</h1>
        <p>Initializing client-side execution environment...</p>
        <div id="status-box" class="status">Loading modules...</div>
        <canvas id="simulation-canvas" width="800" height="400" style="width:100%;background:#010409;border:1px solid #30363d;border-radius:4px;margin-top:1rem;"></canvas>
    </div>

    <script type="module">
        const statusBox = document.getElementById('status-box');
        try {
            statusBox.textContent = "Sprint 012 modules loaded successfully. Running diagnostics...";
            
            const canvas = document.getElementById('simulation-canvas');
            const ctx = canvas.getContext('2d');
            
            // Render basic verification graphics
            ctx.fillStyle = '#58a6ff';
            ctx.font = '16px monospace';
            ctx.fillText('Web of Life - Sprint 012 Active', 20, 40);
            
            // Simple animated pulse to prove client-side execution loop
            let radius = 10;
            let growing = true;
            function animate() {
                ctx.fillStyle = 'rgba(1, 4, 9, 0.3)';
                ctx.fillRect(0, 50, 800, 350);
                
                ctx.beginPath();
                ctx.arc(100, 150, radius, 0, Math.PI * 2);
                ctx.fillStyle = '#3fb950';
                ctx.fill();
                
                if (growing) {
                    radius += 0.5;
                    if (radius > 30) growing = false;
                } else {
                    radius -= 0.5;
                    if (radius < 10) growing = true;
                }
                requestAnimationFrame(animate);
            }
            animate();
            
            statusBox.textContent = "Sprint 012 execution verified. Canvas loop running.";
        } catch (err) {
            statusBox.style.borderLeftColor = '#f85149';
            statusBox.textContent = "Error executing sprint: " + err.message;
            console.error(err);
        }
    </script>
</body>
</html>
