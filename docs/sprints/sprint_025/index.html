<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 25 - Web of Life</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 2rem;
        }
        h1 { color: #58a6ff; margin-top: 0; }
        .status { padding: 1rem; background: #21262d; border-radius: 4px; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sprint 25: Client-Side Diagnostics & Execution</h1>
        <p>The simulation environment and sprint test runner are active.</p>
        <div class="status" id="status-output">Initializing sprint validation...</div>
    </div>

    <script type="module">
        console.log("Sprint 25 environment loaded successfully.");
        const output = document.getElementById('status-output');
        if (output) {
            output.textContent = "Sprint 25 modules loaded and verified successfully.";
        }
    </script>
</body>
</html>
