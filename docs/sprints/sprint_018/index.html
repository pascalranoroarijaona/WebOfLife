<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 18 - Web of Life</title>
    <link rel="stylesheet" href="../../../src/styles/output.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <header class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h1 class="text-xl font-bold">Web of Life - Sprint 18</h1>
        <nav>
            <a href="../../index.html" class="text-indigo-400 hover:underline">Sprint Index</a>
        </nav>
    </header>

    <main class="flex-1 p-6 max-w-6xl mx-auto w-full">
        <div class="bg-slate-800 rounded-lg p-6 shadow-xl border border-slate-700">
            <h2 class="text-2xl font-semibold mb-4">Sprint 18 Execution Environment</h2>
            <p class="text-slate-300 mb-4">Verification and simulation dashboard for Sprint 18 features.</p>
            
            <div id="app" class="mt-6">
                <!-- App mount point -->
            </div>
        </div>
    </main>

    <footer class="p-4 border-t border-slate-800 text-center text-slate-500 text-sm">
        Web of Life &copy; 2026
    </footer>

    <script type="module">
        import { initSprint18 } from '../../../src/sprints/sprint_018/main.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            const app = document.getElementById('app');
            if (app) {
                try {
                    initSprint18(app);
                } catch (err) {
                    console.error('Failed to initialize sprint 18:', err);
                    app.innerHTML = `<div class="text-red-400 p-4 bg-red-950/50 rounded border border-red-800">Error initializing Sprint 18: ${err.message}</div>`;
                }
            }
        });
    </script>
</body>
</html>
