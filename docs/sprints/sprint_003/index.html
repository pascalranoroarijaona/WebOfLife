<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script type="importmap">
  {
    "imports": {
      "h3-js": "https://esm.sh/h3-js"
    }
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thermodynamic Web of Life - Sprint 003</title>

<style>
:root {
  --bg: #02050a;
  --panel: rgba(5, 14, 24, 0.91);
  --panel-light: rgba(17, 35, 48, 0.9);
  --text: #c8f5f2;
  --muted: #7597a8;

  --sun: #ffaa00;
  --earth: #0088ff;
  --flora: #00ff66;
  --fauna: #ff3366;
  --fungi: #c084fc;
  --microbe: #64d8ff;
  --human: #00e1ff;
  --material: #d8c28f;
  --water: #389cff;
  --carbon: #aaaaaa;
  --danger: #ff5370;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: "Courier New", monospace;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  cursor: crosshair;
}

button,
input,
select {
  font-family: inherit;
}

button {
  cursor: pointer;
  color: var(--text);
  background: #102331;
  border: 1px solid #315064;
  border-radius: 5px;
  padding: 7px 10px;
}

button:hover {
  background: #18384c;
  border-color: #00e1ff;
}

#topbar {
  position: fixed;
  z-index: 10;
  top: 18px;
  left: 18px;
  width: min(700px, calc(100vw - 36px));
  padding: 17px 20px;
  background: var(--panel);
  border: 1px solid #00e1ff38;
  border-radius: 10px;
  box-shadow: 0 0 35px #000;
  backdrop-filter: blur(12px);
}

#topbar h1 {
  color: #00ffe1;
  font-size: 1.25rem;
  letter-spacing: 1px;
  margin-bottom: 5px;
}

#topbar h2 {
  color: var(--sun);
  font-size: 0.78rem;
  margin-bottom: 12px;
}

#topbar p {
  color: #9fc7d8;
  font-size: 0.74rem;
  line-height: 1.55;
}

.highlight {
  color: white;
  font-weight: bold;
}

.social-links {
  margin-top: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 0.72rem;
}

.social-links a {
  color: #00e1ff;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid #00e1ff38;
  padding: 5px 10px;
  border-radius: 5px;
  background: rgba(0, 225, 255, 0.05);
  transition: all 0.2s ease;
}

.social-links a:hover {
  background: rgba(0, 225, 255, 0.2);
  border-color: #00e1ff;
  color: #ffffff;
  box-shadow: 0 0 10px rgba(0, 225, 255, 0.3);
}

#controls {
  position: fixed;
  z-index: 11;
  left: 18px;
  bottom: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  width: min(880px, calc(100vw - 36px));
  padding: 11px;
  background: var(--panel);
  border: 1px solid #00e1ff38;
  border-radius: 9px;
  backdrop-filter: blur(12px);
}

#search {
  flex: 1;
  min-width: 150px;
  background: #07131d;
  color: white;
  border: 1px solid #315064;
  border-radius: 5px;
  padding: 8px 10px;
  outline: none;
}

#search:focus {
  border-color: var(--human);
}

.zoom-container,
.debug-container {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.72rem;
  color: #9fc7d8;
  background: #07131d;
  border: 1px solid #315064;
  border-radius: 5px;
  padding: 5px 8px;
  cursor: pointer;
  user-select: none;
}

.zoom-container input[type="range"] {
  width: 75px;
  cursor: pointer;
  accent-color: #00e1ff;
}

.debug-container input[type="checkbox"] {
  cursor: pointer;
  accent-color: var(--sun);
}

#inspector {
  position: fixed;
  z-index: 20;
  top: 18px;
  right: 18px;
  width: min(390px, calc(100vw - 36px));
  max-height: calc(100vh - 36px);
  overflow-y: auto;
  display: none;
  background: var(--panel);
  border: 1px solid #315064;
  border-radius: 10px;
  box-shadow: 0 0 40px #000;
  backdrop-filter: blur(12px);
}

#inspector.open {
  display: block;
}

.inspector-header {
  position: relative;
  padding: 16px;
  border-bottom: 1px solid #315064;
  background: rgba(255,255,255,0.04);
}

.close-x-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 1.1rem;
  cursor: pointer;
}
.close-x-btn:hover {
  color: var(--text);
}
</style>
</head>
<body>
  <div id="topbar">
    <h1>Thermodynamic Web of Life</h1>
    <h2>Sprint 003: Thermodynamic Equilibrium & Bioenergetics</h2>
    <p>Simulating global energy dissipation, entropy flow, and metabolic coupling across biomes.</p>
    <div class="social-links">
      <a href="01_RFC.html">RFC</a>
      <a href="02_METHODS.html">Methods</a>
      <a href="../../../index.html">Main Hub</a>
    </div>
  </div>

  <div id="controls">
    <input type="text" id="search" placeholder="Filter entities or biomes..." />
    <div class="zoom-container">
      <label for="zoomRange">Zoom:</label>
      <input type="range" id="zoomRange" min="0.5" max="3" step="0.1" value="1" />
    </div>
    <div class="debug-container">
      <input type="checkbox" id="debugToggle" />
      <label for="debugToggle">Debug Grid</label>
    </div>
    <button id="resetView">Reset</button>
  </div>

  <div id="inspector">
    <div class="inspector-header">
      <button class="close-x-btn" id="closeInspector">&times;</button>
      <h3 id="inspectorTitle">Inspector</h3>
    </div>
    <div id="inspectorBody" style="padding: 16px; font-size: 0.8rem; line-height: 1.6;">
      Select an entity or thermodynamic node to inspect.
    </div>
  </div>

  <canvas id="worldCanvas"></canvas>
</body>
</html>
