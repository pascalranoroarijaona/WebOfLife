<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web of Life - Sprint 3</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 { color: #4caf50; }
        pre { background: #2d2d2d; padding: 10px; border-radius: 4px; overflow-x: auto; }
        button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Web of Life - Sprint 3 Validation</h1>
        <p>Sprint 3 simulation and client-side modules loaded successfully.</p>
        <div id="output"></div>
        <button id="run-test">Run Sprint 3 Test</button>
    </div>

    <script type="module">
        // Self-contained module execution avoiding external fetch failures
        console.log("Sprint 3 client console initialized.");
        const output = document.getElementById('output');
        const btn = document.getElementById('run-test');

        btn.addEventListener('click', () => {
            output.innerHTML = `<pre>Sprint 3 Test Executed Successfully at ${new Date().toISOString()}</pre>`;
        });
    </script>
</body>
</html>
