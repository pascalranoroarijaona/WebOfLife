<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 27: Web of Life - Client Debugger & Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 500: '#22c55e', 900: '#14532d' }
                    }
                }
            }
        }
    </script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🧬</span>
            <h1 class="text-xl font-bold tracking-tight text-white">Web of Life <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Sprint 27</span></h1>
        </div>
        <div id="status-indicator" class="flex items-center space-x-2 text-xs text-slate-400">
            <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse" id="status-dot"></span>
            <span id="status-text">Initializing Simulation...</span>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row relative overflow-hidden">
        <!-- Sidebar Controls -->
        <aside class="w-full lg:w-80 border-r border-slate-800 bg-slate-900/30 p-6 flex flex-col gap-6 overflow-y-auto">
            <div class="space-y-2">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Controls</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-start" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-4 rounded transition shadow-lg shadow-emerald-900/20 text-sm">Start</button>
                    <button id="btn-pause" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2 px-4 rounded transition text-sm">Pause</button>
                </div>
                <button id="btn-reset" class="w-full bg-slate-800/60 hover:bg-slate-800 text-slate-300 font-medium py-2 px-4 rounded transition text-sm border border-slate-700/50">Reset World</button>
            </div>

            <div class="space-y-3 pt-4 border-t border-slate-800/80">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Metrics</h2>
                <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-4 space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Entities:</span>
                        <span id="metric-entities" class="font-mono font-bold text-emerald-400">0</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">FPS:</span>
                        <span id="metric-fps" class="font-mono font-bold text-slate-200">60</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Generation:</span>
                        <span id="metric-gen" class="font-mono font-bold text-slate-200">1</span>
                    </div>
                </div>
            </div>

            <div class="space-y-3 pt-4 border-t border-slate-800/80 flex-1">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Console Log</h2>
                <div id="console-output" class="bg-slate-950 border border-slate-900 rounded-lg p-3 font-mono text-xs text-slate-400 h-48 overflow-y-auto space-y-1">
                    <div>[System] Sprint 27 Environment Loaded.</div>
                </div>
            </div>
        </aside>

        <!-- Main Viewport -->
        <div class="flex-1 relative bg-slate-950 flex items-center justify-center overflow-hidden" id="viewport-container">
            <canvas id="render-canvas" class="w-full h-full block cursor-grab active:cursor-grabbing"></canvas>
            <div id="overlay-message" class="absolute inset-0 pointer-events-none flex items-center justify-center text-slate-600 font-mono text-sm">
                Rendering Ecosystem Viewport...
            </div>
        </div>
    </main>

    <script type="module">
        import * as THREE from 'three';

        function log(msg) {
            const consoleOut = document.getElementById('console-output');
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            consoleOut.appendChild(div);
            consoleOut.scrollTop = consoleOut.scrollHeight;
        }

        try {
            log("Initializing Three.js scene...");
            const container = document.getElementById('viewport-container');
            const canvas = document.getElementById('render-canvas');
            
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);

            const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 20, 30);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            // Ground grid
            const grid = new THREE.GridHelper(50, 50, 0x22c55e, 0x1e293b);
            grid.position.y = -0.01;
            scene.add(grid);

            // Add sample interactive mesh
            const geometry = new THREE.IcosahedronGeometry(1.5, 1);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x22c55e, 
                wireframe: false,
                roughness: 0.3,
                metalness: 0.8
            });
            const coreMesh = new THREE.Mesh(geometry, material);
            coreMesh.position.y = 1.5;
            scene.add(coreMesh);

            document.getElementById('overlay-message').style.display = 'none';
            document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-emerald-500';
            document.getElementById('status-text').textContent = 'Simulation Active';
            document.getElementById('metric-entities').textContent = '1';

            let isRunning = true;
            let clock = new THREE.Clock();
            let frameCount = 0;
            let lastFpsUpdate = 0;

            function animate() {
                if (!isRunning) return;
                requestAnimationFrame(animate);

                const delta = clock.getDelta();
                const elapsedTime = clock.getElapsedTime();

                coreMesh.rotation.x = elapsedTime * 0.5;
                coreMesh.rotation.y = elapsedTime * 0.3;
                coreMesh.position.y = 1.5 + Math.sin(elapsedTime * 2) * 0.3;

                frameCount++;
                if (elapsedTime - lastFpsUpdate >= 1.0) {
                    document.getElementById('metric-fps').textContent = Math.round(frameCount / (elapsedTime - lastFpsUpdate));
                    frameCount = 0;
                    lastFpsUpdate = elapsedTime;
                }

                renderer.render(scene, camera);
            }

            animate();

            // UI Listeners
            document.getElementById('btn-start').addEventListener('click', () => {
                if (!isRunning) {
                    isRunning = true;
                    clock.start();
                    animate();
                    log("Simulation resumed.");
                }
            });

            document.getElementById('btn-pause').addEventListener('click', () => {
                isRunning = false;
                log("Simulation paused.");
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                coreMesh.position.set(0, 1.5, 0);
                clock = new THREE.Clock();
                log("World reset to initial state.");
            });

            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });

            log("Sprint 27 fully operational.");
        } catch (err) {
            console.error("Initialization failure:", err);
            log(`ERROR: ${err.message}`);
            document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-rose-500';
            document.getElementById('status-text').textContent = 'Initialization Failed';
        }
    </script>
</body>
</html>
