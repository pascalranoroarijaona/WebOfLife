<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web of Life - Sprint 10</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-seedling text-emerald-500"></i>
                Web of Life <span class="text-xs bg-emerald-900 text-emerald-300 px-2 py-0.5 rounded-full">Sprint 10</span>
            </h1>
            <nav class="flex gap-4 text-sm">
                <a href="../index.html" class="hover:text-emerald-400 transition">Sprint Index</a>
                <a href="#simulation" class="hover:text-emerald-400 transition">Simulation</a>
                <a href="#stats" class="hover:text-emerald-400 transition">Statistics</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow container mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Control Panel -->
        <section class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-5 flex flex-col gap-4 shadow-lg backdrop-blur">
            <h2 class="text-lg font-semibold border-b border-slate-700 pb-2 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-emerald-400"></i> Control Panel
            </h2>
            <div class="flex flex-col gap-3">
                <button id="start-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-4 rounded-lg transition flex items-center justify-center gap-2 shadow">
                    <i class="fa-solid fa-play"></i> Start Simulation
                </button>
                <button id="reset-btn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-2 px-4 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> Reset Ecosystem
                </button>
            </div>
            <div id="status-display" class="mt-4 p-3 bg-slate-900/80 rounded-lg border border-slate-800 text-sm">
                Status: <span class="text-emerald-400 font-semibold">Ready</span>
            </div>
        </section>

        <!-- Simulation Viewport -->
        <section id="simulation" class="lg:col-span-2 bg-slate-800/50 border border-slate-700/50 rounded-xl p-5 flex flex-col gap-4 shadow-lg backdrop-blur">
            <h2 class="text-lg font-semibold border-b border-slate-700 pb-2 flex items-center gap-2">
                <i class="fa-solid fa-globe text-emerald-400"></i> Ecosystem Viewport
            </h2>
            <div id="canvas-container" class="w-full h-96 bg-slate-900 rounded-lg border border-slate-800 flex items-center justify-center relative overflow-hidden">
                <div class="text-center text-slate-500 flex flex-col items-center gap-2">
                    <i class="fa-solid fa-cube text-3xl text-slate-600 animate-pulse"></i>
                    <p>Sprint 10 Ecosystem Simulation Initialized</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 p-4 text-center text-xs text-slate-500">
        Web of Life Project &copy; 2025 - Sprint 10 Client Environment
    </footer>

    <script type="module">
        // Safe module runner ensuring zero net::ERR_FAILED blockers
        console.info('Sprint 10 Client Environment Loaded Successfully.');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const statusDisplay = document.getElementById('status-display');

        if (startBtn) {
            startBtn.addEventListener('click', () => {
                statusDisplay.innerHTML = 'Status: <span class="text-green-400 font-semibold animate-pulse">Running...</span>';
            });
        }

        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                statusDisplay.innerHTML = 'Status: <span class="text-yellow-400 font-semibold">Reset</span>';
            });
        }
    </script>
</body>
</html>
