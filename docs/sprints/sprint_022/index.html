<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 22: Web of Life - Client Debugger & Ecosystem Simulation</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            900: '#14532d',
                            950: '#052e16'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full flex flex-col overflow-hidden bg-slate-950 text-slate-100 font-sans">
    <!-- Header -->
    <header class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-900/50 backdrop-blur">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <h1 class="text-lg font-bold tracking-tight text-white">Web of Life <span class="text-xs px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800">Sprint 22</span></h1>
        </div>
        <div class="flex items-center space-x-4 text-sm text-slate-400">
            <span id="system-status" class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-amber-500" id="status-dot"></span>
                <span id="status-text">Initializing Simulation...</span>
            </span>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex overflow-hidden">
        <!-- Sidebar Controls -->
        <aside class="w-80 border-r border-slate-800 bg-slate-900/30 flex flex-col p-4 space-y-6 overflow-y-auto">
            <div class="space-y-2">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Simulation Controls</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-start" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded shadow transition text-sm">Start</button>
                    <button id="btn-pause" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium rounded shadow transition text-sm">Pause</button>
                </div>
                <button id="btn-reset" class="w-full px-4 py-2 bg-rose-950/40 hover:bg-rose-900/50 text-rose-300 border border-rose-800/50 font-medium rounded shadow transition text-sm">Reset Simulation</button>
            </div>

            <div class="space-y-2">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Ecosystem Parameters</h2>
                <div class="space-y-3 bg-slate-900/60 p-3 rounded-lg border border-slate-800/80">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Population Density</label>
                        <input type="range" id="slider-density" min="10" max="500" value="100" class="w-full accent-emerald-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Mutation Rate</label>
                        <input type="range" id="slider-mutation" min="0" max="100" value="15" class="w-full accent-emerald-500">
                    </div>
                </div>
            </div>

            <div class="mt-auto space-y-2 pt-4 border-t border-slate-800">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Console Log</h2>
                <div id="console-output" class="h-32 bg-slate-950 rounded border border-slate-900 p-2 font-mono text-xs text-slate-400 overflow-y-auto space-y-1">
                    <div>[System] Sprint 22 client initialized.</div>
                </div>
            </div>
        </aside>

        <!-- Canvas Viewport -->
        <div class="flex-1 relative bg-slate-950 flex items-center justify-center overflow-hidden">
            <canvas id="simulation-canvas" class="w-full h-full block"></canvas>
            <div id="overlay-stats" class="absolute top-4 right-4 bg-slate-900/80 backdrop-blur border border-slate-800 rounded-lg p-3 text-xs space-y-1 font-mono pointer-events-none">
                <div>FPS: <span id="stat-fps" class="text-emerald-400">60</span></div>
                <div>Entities: <span id="stat-entities" class="text-emerald-400">0</span></div>
                <div>Ticks: <span id="stat-ticks" class="text-emerald-400">0</span></div>
            </div>
        </div>
    </main>

    <!-- Client Script Entry Point -->
    <script type="module">
        import { initSprint22 } from '../../../src/sprints/sprint_022/index.js';
        
        window.addEventListener('DOMContentLoaded', () => {
            const consoleEl = document.getElementById('console-output');
            const log = (msg) => {
                const div = document.createElement('div');
                div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                consoleEl.appendChild(div);
                consoleEl.scrollTop = consoleEl.scrollHeight;
            };

            try {
                initSprint22({
                    canvas: document.getElementById('simulation-canvas'),
                    onLog: log,
                    statusText: document.getElementById('status-text'),
                    statusDot: document.getElementById('status-dot'),
                    stats: {
                        fps: document.getElementById('stat-fps'),
                        entities: document.getElementById('stat-entities'),
                        ticks: document.getElementById('stat-ticks')
                    },
                    controls: {
                        start: document.getElementById('btn-start'),
                        pause: document.getElementById('btn-pause'),
                        reset: document.getElementById('btn-reset'),
                        density: document.getElementById('slider-density'),
                        mutation: document.getElementById('slider-mutation')
                    }
                });
                log('Sprint 22 initialized successfully.');
            } catch (err) {
                log(`Initialization error: ${err.message}`);
                console.error(err);
            }
        });
    </script>
</body>
</html>
