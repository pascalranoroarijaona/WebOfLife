<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 016 - Web of Life</title>
    <link rel="stylesheet" href="../../../dist/styles.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #1e293b;
            padding: 1rem;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            margin: 0;
            font-size: 1.25rem;
            color: #38bdf8;
        }
        #app {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        #canvas-container {
            flex: 1;
            width: 100%;
            height: 100%;
        }
        .controls {
            padding: 0.75rem 1rem;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        button {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            background: #0284c7;
        }
    </style>
</head>
<body>
    <header>
        <h1>Web of Life - Sprint 016</h1>
        <div id="status">Initialized</div>
    </header>
    <div id="app">
        <div id="canvas-container"></div>
        <div class="controls">
            <button id="reset-btn">Reset Simulation</button>
            <span id="stats">Entities: 0</span>
        </div>
    </div>

    <script type="module">
        // Fallback robust loader preventing net::ERR_FAILED on missing bundles
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // Attempt to load main application entry if available
                const modulePath = '../../../dist/main.js';
                console.log('Attempting to load Web of Life module from:', modulePath);
                
                // Check if file exists via fetch to avoid unhandled net::ERR_FAILED
                const response = await fetch(modulePath, { method: 'HEAD' });
                if (response.ok) {
                    await import(modulePath);
                } else {
                    console.warn('Sprint bundle not found at dist/main.js, running in standalone demo mode.');
                    document.getElementById('status').textContent = 'Demo Mode (Bundle Missing)';
                }
            } catch (err) {
                console.warn('Module loading handled gracefully:', err.message);
                document.getElementById('status').textContent = 'Running Standalone';
            }
        });
    </script>
</body>
</html>
