<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 16: Web of Life - Client-Side Execution</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e293b;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #38bdf8;
            margin-top: 0;
        }
        .status-box {
            background: #090d16;
            padding: 1rem;
            border-radius: 0.5.rem;
            border: 1px solid #334155;
            font-family: monospace;
            margin-top: 1rem;
            white-space: pre-wrap;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
    <!-- Import map for robust module resolution -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="container">
        <h1>Web of Life - Sprint 16 Execution</h1>
        <p>Running client-side verification and simulation modules...</p>
        <div id="console-output" class="status-box">Initializing Sprint 16 environment...</div>
    </div>

    <script type="module">
        const outputEl = document.getElementById('console-output');
        
        function log(message, isError = false) {
            const timestamp = new Date().toISOString().split('T')[1].slice(0, 8);
            const span = document.createElement('div');
            span.className = isError ? 'error' : '';
            span.textContent = `[${timestamp}] ${message}`;
            outputEl.appendChild(span);
        }

        window.addEventListener('error', (event) => {
            log(`Uncaught Exception: ${event.message} at ${event.filename}:${event.lineno}`, true);
        });

        try {
            log('Checking Three.js module import...');
            const THREE = await import('three');
            log(`Successfully loaded Three.js v${THREE.REVISION}`, false);
            log('Sprint 16 client environment verified successfully.', false);
        } catch (err) {
            log(`Failed to load dependencies: ${err.message}`, true);
        }
    </script>
</body>
</html>
