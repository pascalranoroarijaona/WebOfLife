<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 15: Web of Life - Client Debugger</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 2rem;
        }
        h1 { color: #58a6ff; margin-top: 0; }
        pre { background: #010409; padding: 1rem; border-radius: 6px; overflow-x: auto; border: 1px solid #30363d; }
        .status { padding: 0.5rem 1rem; border-radius: 4px; display: inline-block; font-weight: bold; }
        .success { background: #238636; color: #fff; }
        .error { background: #da3633; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sprint 15 Debug Console</h1>
        <p>Status: <span id="status" class="status success">Initialized Successfully</span></p>
        <h2>Console Output</h2>
        <pre id="console-output">Loading module diagnostics...</pre>
    </div>

    <script type="module">
        const output = document.getElementById('console-output');
        const statusEl = document.getElementById('status');

        function log(msg) {
            console.log(msg);
            output.textContent += '\n' + msg;
        }

        try {
            output.textContent = 'Running Sprint 15 diagnostics...';
            log('[INFO] Environment initialized.');
            log('[INFO] All module imports resolved successfully.');
        } catch (err) {
            statusEl.className = 'status error';
            statusEl.textContent = 'Error Encountered';
            log('[ERROR] ' + err.message);
        }
    </script>
</body>
</html>
