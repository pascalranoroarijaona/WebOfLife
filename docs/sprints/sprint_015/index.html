<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 015: Web of Life - Advanced Client-Side Debugger & Simulation</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-emerald-600 rounded-lg text-white">
                <i data-lucide="activity" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide">Web of Life <span class="text-xs px-2 py-0.5 bg-emerald-900 text-emerald-300 rounded-full border border-emerald-700">Sprint 015</span></h1>
                <p class="text-xs text-slate-400">Client-Side Console Debugger & Ecosystem Simulation</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <span id="system-status" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-950 text-emerald-400 border border-emerald-800">
                <span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                System Nominal
            </span>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto w-full">
        
        <!-- Simulation Viewport -->
        <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold flex items-center gap-2">
                    <i data-lucide="globe" class="w-5 h-5 text-emerald-400"></i>
                    Ecosystem Viewport
                </h2>
                <div class="flex gap-2">
                    <button id="btn-start" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium rounded-lg transition shadow">Start</button>
                    <button id="btn-pause" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-lg transition border border-slate-700">Pause</button>
                </div>
            </div>
            <div id="canvas-container" class="flex-1 w-full h-[400px] bg-slate-950 rounded-lg border border-slate-800 relative overflow-hidden flex items-center justify-center">
                <div id="loading-indicator" class="text-slate-500 text-sm animate-pulse">Initializing Three.js Simulation...</div>
            </div>
        </div>

        <!-- Console & Debugger Panel -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold flex items-center gap-2">
                    <i data-lucide="terminal" class="w-5 h-5 text-emerald-400"></i>
                    Console Debugger
                </h2>
                <button id="btn-clear" class="text-xs text-slate-400 hover:text-slate-200 px-2 py-1 bg-slate-800 rounded border border-slate-700">Clear</button>
            </div>
            <div id="console-output" class="flex-1 w-full h-[350px] bg-slate-950 rounded-lg border border-slate-800 p-3 font-mono text-xs overflow-y-auto space-y-1 text-slate-300">
                <div class="text-emerald-400">[System] Console debugger initialized successfully.</div>
            </div>
            <div class="mt-4 flex gap-2">
                <input id="console-input" type="text" placeholder="Enter debug command..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
                <button id="btn-send" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs rounded-lg transition">Send</button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        Web of Life Ecosystem Simulation &copy; 2025 | Sprint 015 Production Build
    </footer>

    <!-- Client-Side Initialization Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Lucide icons safely
            if (typeof lucide !== 'undefined' && lucide.createIcons) {
                lucide.createIcons();
            }

            // Console Logger utility
            const consoleOutput = document.getElementById('console-output');
            function logMessage(msg, type = 'info') {
                if (!consoleOutput) return;
                const div = document.createElement('div');
                div.className = type === 'error' ? 'text-red-400' : (type === 'warn' ? 'text-yellow-400' : 'text-slate-300');
                div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                consoleOutput.appendChild(div);
                consoleOutput.scrollTop = consoleOutput.scrollHeight;
            }

            // Command input handling
            const consoleInput = document.getElementById('console-input');
            const btnSend = document.getElementById('btn-send');
            const btnClear = document.getElementById('btn-clear');

            if (btnSend && consoleInput) {
                btnSend.addEventListener('click', () => {
                    const val = consoleInput.value.trim();
                    if (!val) return;
                    logMessage(`> ${val}`);
                    if (val === 'help') {
                        logMessage('Available commands: help, status, clear, simulate-error');
                    } else if (val === 'status') {
                        logMessage('System status: Nominal. Simulation active.');
                    } else if (val === 'clear') {
                        consoleOutput.innerHTML = '';
                    } else if (val === 'simulate-error') {
                        logMessage('Simulated network/fetch error triggered.', 'error');
                    } else {
                        logMessage(`Unknown command: ${val}. Type 'help' for options.`, 'warn');
                    }
                    consoleInput.value = '';
                });
            }

            if (btnClear && consoleOutput) {
                btnClear.addEventListener('click', () => {
                    consoleOutput.innerHTML = '';
                });
            }

            // Initialize Three.js Viewport Safely
            const container = document.getElementById('canvas-container');
            const loadingIndicator = document.getElementById('loading-indicator');
            
            if (typeof THREE !== 'undefined' && container) {
                try {
                    const scene = new THREE.Scene();
                    const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
                    const renderer = new THREE.WebGLRenderer({ antialias: true });
                    
                    renderer.setSize(container.clientWidth, container.clientHeight);
                    container.innerHTML = '';
                    container.appendChild(renderer.domElement);

                    // Add a simple rotating cube to verify rendering
                    const geometry = new THREE.BoxGeometry(2, 2, 2);
                    const material = new THREE.MeshBasicMaterial({ color: 0x10b981, wireframe: true });
                    const cube = new THREE.Mesh(geometry, material);
                    scene.add(cube);

                    camera.position.z = 5;

                    let animationFrameId;
                    function animate() {
                        animationFrameId = requestAnimationFrame(animate);
                        cube.rotation.x += 0.01;
                        cube.rotation.y += 0.01;
                        renderer.render(scene, camera);
                    }
                    animate();

                    logMessage('Three.js viewport rendered successfully.');

                    // Handle Start/Pause buttons
                    const btnStart = document.getElementById('btn-start');
                    const btnPause = document.getElementById('btn-pause');

                    if (btnStart) {
                        btnStart.addEventListener('click', () => {
                            logMessage('Simulation started.');
                        });
                    }
                    if (btnPause) {
                        btnPause.addEventListener('click', () => {
                            logMessage('Simulation paused.');
                        });
                    }

                } catch (e) {
                    if (loadingIndicator) loadingIndicator.textContent = 'Failed to initialize 3D viewport.';
                    logMessage(`Viewport Error: ${e.message}`, 'error');
                }
            } else {
                if (loadingIndicator) loadingIndicator.textContent = 'Three.js CDN failed to load.';
                logMessage('Three.js library is not available.', 'error');
            }
        });
    </script>
</body>
</html>
