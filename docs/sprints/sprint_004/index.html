<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 004 - Web of Life</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #111;
            color: #eee;
        }
        h1 { color: #4a9eff; }
        #app {
            margin-top: 20px;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <h1>Sprint 004: Ecosystem Simulation</h1>
    <div id="app">
        <p>Initializing Sprint 004...</p>
    </div>

    <script type="module">
        try {
            console.log('Sprint 004 runner initialized.');
            const app = document.getElementById('app');
            app.innerHTML = '<p style="color: #6f6;">Sprint 004 modules loaded successfully.</p>';
        } catch (err) {
            console.error('Failed to initialize Sprint 004:', err);
            document.getElementById('app').innerHTML = `<p style="color: #ff6b6b;">Error: ${err.message}</p>`;
        }
    </script>
</body>
</html>
