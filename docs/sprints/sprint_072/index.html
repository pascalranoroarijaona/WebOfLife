<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 072: Web of Life - Thermodynamic State Vector Discrepancy Absolute Difference Math Function</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans overflow-x-hidden">
    <!-- Topbar Navigation -->
    <header id="topbar" class="border-b border-slate-800 bg-slate-900/85 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-xl">
        <div class="flex items-center space-x-3">
            <span class="text-2xl animate-pulse">🧬</span>
            <h1 class="text-xl font-bold tracking-tight text-white">Web of Life <span class="text-xs px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">Sprint 072</span></h1>
        </div>
        <div id="status-indicator" class="flex items-center space-x-2 text-xs text-slate-400">
            <span class="w-2 h-2 rounded-full bg-cyan-500 animate-pulse" id="status-dot"></span>
            <span id="status-text">computeAbsoluteStockDelta() Active (60 FPS Draw Loop)</span>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row relative overflow-hidden">
        <!-- Sidebar Controls -->
        <aside id="controls" class="w-full lg:w-80 border-r border-slate-800 bg-slate-900/40 p-6 flex flex-col gap-6 overflow-y-auto z-20">
            <div class="space-y-2">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Controls</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-start" class="bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2 px-4 rounded transition shadow-lg shadow-cyan-900/20 text-sm cursor-pointer">Start</button>
                    <button id="btn-pause" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2 px-4 rounded transition text-sm cursor-pointer">Pause</button>
                </div>
                <button id="btn-reset" class="w-full bg-slate-800/60 hover:bg-slate-800 text-slate-300 font-medium py-2 px-4 rounded transition text-sm border border-slate-700/50 cursor-pointer">Reset World</button>
                <button id="btn-validate" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-4 rounded transition text-sm shadow-lg shadow-emerald-900/20 cursor-pointer">Run Delta Validator</button>
            </div>

            <div class="space-y-3 pt-4 border-t border-slate-800/80">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Metrics</h2>
                <div id="sprint-telemetry" class="bg-slate-900/80 border border-slate-800 rounded-lg p-4 space-y-3 shadow-inner">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Entities:</span>
                        <span id="metric-entities" class="font-mono font-bold text-cyan-400">72</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">FPS:</span>
                        <span id="metric-fps" class="font-mono font-bold text-slate-200">60</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Generation:</span>
                        <span id="metric-gen" class="font-mono font-bold text-slate-200">1</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">Absolute Delta:</span>
                        <span id="metric-delta" class="font-mono font-bold text-emerald-400">0.0000</span>
                    </div>
                </div>
            </div>

            <div class="space-y-3 pt-4 border-t border-slate-800/80">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Validator Log</h2>
                <div id="log-output" class="bg-slate-950/80 border border-slate-900 rounded p-3 font-mono text-xs text-slate-400 h-32 overflow-y-auto">
                    [System] Initialized Thermodynamic State Vector Discrepancy Module. Ready.
                </div>
            </div>
        </aside>

        <!-- Main Simulation Viewport -->
        <div id="viewport-container" class="flex-1 relative bg-slate-950 overflow-hidden flex items-center justify-center">
            <div id="canvas-container" class="absolute inset-0"></div>
            
            <!-- Overlay badge -->
            <div class="absolute top-4 left-4 z-10 bg-slate-900/80 border border-slate-800 backdrop-blur px-4 py-2 rounded-lg shadow-lg flex items-center space-x-3 pointer-events-none">
                <span class="w-3 h-3 rounded-full bg-emerald-500 animate-ping"></span>
                <span class="text-xs font-mono tracking-wide text-slate-200">Thermodynamic State Vector Engine v0.72</span>
            </div>
        </div>
    </main>

    <!-- Client-side Simulation and UI Script -->
    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, globeGroup;
        let isRunning = true;
        let frameCount = 0;
        let lastTime = performance.now();
        let fps = 60;
        let gen = 1;
        let totalDelta = 0.0;

        const logOutput = document.getElementById('log-output');
        const metricEntities = document.getElementById('metric-entities');
        const metricFps = document.getElementById('metric-fps');
        const metricGen = document.getElementById('metric-gen');
        const metricDelta = document.getElementById('metric-delta');

        function log(msg) {
            const timestamp = new Date().toLocaleTimeString();
            logOutput.innerHTML += `<div>[${timestamp}] ${msg}</div>`;
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        // Thermodynamic Math function: computeAbsoluteStockDelta
        function computeAbsoluteStockDelta(currentVector, targetVector) {
            let sum = 0;
            const keys = Object.keys(currentVector);
            for (const key of keys) {
                const diff = (currentVector[key] || 0) - (targetVector[key] || 0);
                sum += Math.abs(diff);
            }
            return sum;
        }

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020617, 0.015);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, 18);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x06b6d4, 2, 50);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            // Globe & nodes
            globeGroup = new THREE.Group();
            scene.add(globeGroup);

            // Create wireframe globe sphere
            const sphereGeo = new THREE.SphereGeometry(6, 32, 32);
            const sphereMat = new THREE.MeshBasicMaterial({
                color: 0x0e7490,
                wireframe: true,
                transparent: true,
                opacity: 0.15
            });
            const globeMesh = new THREE.Mesh(sphereGeo, sphereMat);
            globeGroup.add(globeMesh);

            // Create thermodynamic state nodes (72 nodes)
            const nodeGeo = new THREE.SphereGeometry(0.25, 16, 16);
            for (let i = 0; i < 72; i++) {
                const phi = Math.acos(-1 + (2 * i) / 72);
                const theta = Math.sqrt(72 * Math.PI) * phi;

                const nodeMat = new THREE.MeshStandardMaterial({
                    color: i % 2 === 0 ? 0x06b6d4 : 0x10b981,
                    roughness: 0.3,
                    metalness: 0.8
                });
                const node = new THREE.Mesh(nodeGeo, nodeMat);
                node.position.setFromSphericalCoords(6, phi, theta);
                globeGroup.add(node);
            }

            window.addEventListener('resize', onWindowResize);
            setupControls();
            animate();
            log('Simulation successfully initialized with 72 thermodynamic nodes.');
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function setupControls() {
            document.getElementById('btn-start').addEventListener('click', () => {
                isRunning = true;
                document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-cyan-500 animate-pulse';
                document.getElementById('status-text').textContent = 'computeAbsoluteStockDelta() Active (60 FPS Draw Loop)';
                log('Simulation resumed.');
            });

            document.getElementById('btn-pause').addEventListener('click', () => {
                isRunning = false;
                document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-amber-500';
                document.getElementById('status-text').textContent = 'Simulation Paused';
                log('Simulation paused.');
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                gen = 1;
                globeGroup.rotation.set(0, 0, 0);
                log('World reset to initial thermodynamic state vector.');
            });

            document.getElementById('btn-validate').addEventListener('click', () => {
                const v1 = { energy: 100.5, entropy: 45.2, biomass: 78.9, exergy: 210.3 };
                const v2 = { energy: 98.2, entropy: 46.0, biomass: 79.1, exergy: 205.0 };
                const delta = computeAbsoluteStockDelta(v1, v2);
                totalDelta = delta;
                metricDelta.textContent = delta.toFixed(4);
                log(`Validated computeAbsoluteStockDelta(): Absolute Difference = ${delta.toFixed(4)}`);
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            frameCount++;
            if (now - lastTime >= 1000) {
                fps = Math.round((frameCount * 1000) / (now - lastTime));
                frameCount = 0;
                lastTime = now;
                metricFps.textContent = fps;
            }

            if (isRunning) {
                globeGroup.rotation.y += 0.003;
                globeGroup.rotation.x += 0.001;

                if (Math.random() < 0.02) {
                    gen++;
                    metricGen.textContent = gen;
                    const vA = { energy: Math.random() * 100, entropy: Math.random() * 50 };
                    const vB = { energy: Math.random() * 100, entropy: Math.random() * 50 };
                    const d = computeAbsoluteStockDelta(vA, vB);
                    metricDelta.textContent = d.toFixed(4);
                }
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
