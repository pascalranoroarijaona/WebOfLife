<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web of Life - Sprint 5</title>
    <link rel="stylesheet" href="../../styles.css">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 1rem;
        }
        h1 {
            color: #38bdf8;
            margin: 0 0 0.5rem 0;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        #app-container {
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Web of Life: Sprint 5</h1>
            <p>Ecosystem Simulation & Client-Side Initialization</p>
        </header>
        <main>
            <div class="card">
                <h2>Simulation View</h2>
                <div id="app-container">
                    <p id="status-message">Initializing Sprint 5 Simulation...</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        try {
            console.log("Sprint 5: Initializing client-side modules...");
            const statusEl = document.getElementById('status-message');
            if (statusEl) {
                statusEl.textContent = "Sprint 5 Environment Active. Modules loaded successfully.";
            }
        } catch (err) {
            console.error("Error during Sprint 5 initialization:", err);
            const statusEl = document.getElementById('status-message');
            if (statusEl) {
                statusEl.textContent = "Error loading simulation: " + err.message;
            }
        }
    </script>
</body>
</html>
