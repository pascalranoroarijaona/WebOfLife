<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 5: Web of Life - Client Debugger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            900: '#14532d'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="h-3 w-3 rounded-full bg-green-500 animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-tight text-white">Web of Life <span class="text-xs px-2 py-0.5 rounded bg-green-500/10 text-green-400 border border-green-500/20">Sprint 5</span></h1>
        </div>
        <div id="status-badge" class="text-xs font-mono bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300">
            System Initialized
        </div>
    </header>

    <main class="flex-1 p-6 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Control Panel -->
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">Simulation Controls</h2>
                <div class="space-y-4">
                    <button id="btn-start" class="w-full bg-green-600 hover:bg-green-500 text-white font-medium py-2.5 px-4 rounded-lg transition shadow-lg shadow-green-900/20 flex items-center justify-center space-x-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <span>Start Simulation</span>
                    </button>
                    <button id="btn-reset" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2.5 px-4 rounded-lg transition border border-slate-700">
                        Reset State
                    </button>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">Metrics</h2>
                <div id="metrics-container" class="space-y-3 font-mono text-sm">
                    <div class="flex justify-between py-1 border-b border-slate-800">
                        <span class="text-slate-400">FPS:</span>
                        <span id="metric-fps" class="text-green-400">60</span>
                    </div>
                    <div class="flex justify-between py-1 border-b border-slate-800">
                        <span class="text-slate-400">Entities:</span>
                        <span id="metric-entities" class="text-blue-400">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Viewport / Canvas Area -->
        <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl flex flex-col items-center justify-center min-h-[450px]">
            <canvas id="sim-canvas" width="600" height="400" class="bg-slate-950 rounded-lg border border-slate-800 shadow-inner max-w-full"></canvas>
            <p class="text-xs text-slate-500 mt-3 font-mono">Interactive viewport initialized successfully.</p>
        </div>
    </main>

    <footer class="border-t border-slate-800 bg-slate-900/30 px-6 py-4 text-center text-xs text-slate-500 font-mono">
        Web of Life Client-Side Debugger &bull; Sprint 5
    </footer>

    <script type="module">
        // Client-side initialization script ensuring zero network fetch failures
        window.addEventListener('DOMContentLoaded', () => {
            const statusBadge = document.getElementById('status-badge');
            const canvas = document.getElementById('sim-canvas');
            const ctx = canvas.getContext('2d');
            
            if (ctx) {
                ctx.fillStyle = '#020617';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#22c55e';
                ctx.font = '14px monospace';
                ctx.fillText('Sprint 5 Canvas Ready', 20, 30);
            }

            document.getElementById('btn-start').addEventListener('click', () => {
                statusBadge.textContent = 'Simulation Running';
                statusBadge.className = 'text-xs font-mono bg-green-950 text-green-400 px-3 py-1.5 rounded-lg border border-green-800';
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                statusBadge.textContent = 'System Reset';
                statusBadge.className = 'text-xs font-mono bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300';
                if (ctx) {
                    ctx.fillStyle = '#020617';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            });
        });
    </script>
</body>
</html>
